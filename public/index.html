<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Belote</title>
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Belote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1d2b24; --muted:#6b7a72; --accent:#1f6b4a; --danger:#b3382c; --line:#e3ded2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121a16; --card:#1b2621; --ink:#e8efe9; --muted:#8fa196; --accent:#4cc38a; --danger:#e5746a; --line:#2b3a33; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 16px; font-size:20px; font-weight:700; }
  nav { display:flex; gap:6px; padding:0 16px 8px; }
  nav button { flex:1; padding:10px 4px; font-size:15px !important; border:0; border-radius:10px; background:var(--card); color:var(--ink); font:inherit; font-weight:600; }
  nav button.on { background:var(--accent); color:#fff; }
  main { padding:0 16px 40px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid var(--line); }
  h2 { margin:0 0 10px; font-size:17px; }
  input, select { font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); width:100%; }
  button.btn { padding:10px 14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; }
  button.ghost { background:transparent; color:var(--danger); border:0; font:inherit; padding:6px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .row > .fit { flex:0 0 auto; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .team { background:var(--bg); border-radius:12px; padding:10px; display:grid; gap:8px; }
  .team b { font-size:14px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:8px 4px; text-align:right; border-bottom:1px solid var(--line); }
  td:first-child, th:first-child { text-align:left; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .rank { color:var(--muted); width:28px; }
  .win { color:var(--accent); font-weight:700; }
  .muted { color:var(--muted); font-size:14px; }
  .game { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .game:last-child { border:0; }
  body.busy button { opacity:.5; pointer-events:none; }
  .eventbar { margin-bottom:12px; }
  .eventbar select { background:var(--card); font-weight:600; }
  .actions { display:flex; gap:2px; flex:0 0 auto; }
  button.link { background:transparent; color:var(--accent); border:0; font:inherit; padding:6px; }
  .match { border-left:4px solid var(--accent); }
  .match h2 { display:flex; justify-content:space-between; align-items:center; }
  .match .side { display:grid; grid-template-columns:1fr 110px; gap:8px; align-items:center; margin-bottom:8px; }
  .tag { font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px; }
  .err { color:var(--danger); font-size:14px; min-height:18px; }
</style>
</head>
<body>
<header>🃏 Score Belote <small id="status" role="status" style="color:var(--danger);font-size:13px"></small></header>
<nav>
  <button data-tab="classement" class="on">Classement</button>
  <button data-tab="partie">Partie</button>
  <button data-tab="joueurs">Joueurs</button>
  <button data-tab="evenements">Événements</button>
</nav>
<main id="app"></main>

<script>
let state = { events:[], players:[], games:[] };
const EVENT_KEY = 'belote-evenement';
let eventId = (() => { try { return localStorage.getItem(EVENT_KEY) || ''; } catch { return ''; } })();
let tab = 'classement';
let draft = { a1:'', a2:'', b1:'', b2:'', sa:'', sb:'', err:'' };
// Scores en cours de saisie pour les matchs en cours, par id (survivent aux rafraîchissements)
let scoreDraft = {};

// URLs relatives : fonctionne derrière Traefik, même sous un préfixe (StripPrefix)
async function api(method, url, body) {
  const r = await fetch('api/' + url, {
    method, headers: { 'Content-Type':'application/json' }, body: JSON.stringify(body ?? {}),
  }).catch(() => { throw new Error('Hors ligne : modification impossible.'); });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}
async function refresh(force) {
  try {
    const r = await fetch('api/state');
    if (!r.ok) throw new Error();
    const next = await r.json();
    const changed = JSON.stringify(next) !== JSON.stringify(state);
    state = next;
    const typing = ['INPUT', 'SELECT'].includes(document.activeElement?.tagName);
    if (changed && (force || !typing)) render();
    setOnline(!r.headers.get('X-Offline'));
  } catch { setOnline(false); }
}
// Une seule écriture à la fois : évite les doublons sur double clic
let busy = false;
async function act(fn) {
  if (busy) return;
  busy = true;
  document.body.classList.add('busy');
  try { await fn(); await refresh(true); }
  catch (e) { alert(e.message); }
  finally { busy = false; document.body.classList.remove('busy'); }
}
function setOnline(ok) { document.getElementById('status').textContent = ok ? '' : '⚠ hors ligne'; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Ordre alphabétique français (accents et majuscules ignorés : Émile entre Elsa et Félix)
const byName = (x, y) => x.name.localeCompare(y.name, 'fr', { sensitivity: 'base' });
const sortedPlayers = () => [...state.players].sort(byName);
const name = id => (state.players.find(p => p.id === id) || { name:'?' }).name;

// Événement affiché : le choix mémorisé sur cet appareil, sinon le plus récent
const eventsRecentFirst = () => [...state.events].sort((x, y) => y.createdAt - x.createdAt);
function currentEvent() {
  return state.events.find(e => e.id === eventId) || eventsRecentFirst()[0] || null;
}
function pickEvent(id) {
  eventId = id;
  try { localStorage.setItem(EVENT_KEY, id); } catch {}
  draft = { a1:'', a2:'', b1:'', b2:'', sa:'', sb:'', err:'' };
  render();
}
const eventGames = ev => state.games.filter(g => g.eventId === ev?.id);
const isPending = g => g.sa === null;
const finishedGames = ev => eventGames(ev).filter(g => !isPending(g)).sort((x, y) => x.finishedAt - y.finishedAt);
const pendingGames = ev => eventGames(ev).filter(isPending).sort((x, y) => x.table - y.table);
const teamNames = ids => esc(ids.map(name).join(' & '));
const fmtDate = t => new Date(t).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });

function stats(games) {   // parties terminées uniquement
  const s = Object.fromEntries(state.players.map(p => [p.id, { id:p.id, name:p.name, pts:0, games:0, wins:0 }]));
  for (const g of games) {
    for (const [team, mine, theirs] of [[g.a, g.sa, g.sb], [g.b, g.sb, g.sa]]) {
      for (const id of team) {
        if (!s[id]) continue;
        s[id].pts += mine; s[id].games++;
        if (mine > theirs) s[id].wins++;
      }
    }
  }
  return Object.values(s).filter(p => p.games).sort((x, y) => y.pts - x.pts || y.wins - x.wins || byName(x, y));
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const app = document.getElementById('app');
  const view = { classement:viewRanking, partie:viewGame, joueurs:viewPlayers, evenements:viewEvents }[tab]();
  app.innerHTML = (tab === 'classement' || tab === 'partie' ? eventBar() : '') + view;
}

function eventBar() {
  const ev = currentEvent();
  if (!ev) return '';
  const opts = eventsRecentFirst().map(e =>
    `<option value="${e.id}" ${e.id === ev.id ? 'selected' : ''}>${esc(e.name)} · ${fmtDate(e.createdAt)}</option>`).join('');
  return `<div class="eventbar"><select onchange="pickEvent(this.value)" aria-label="Événement">${opts}</select></div>`;
}
const noEvent = () => `<div class="card muted">Créez d'abord un événement dans l'onglet « Événements ».</div>`;

function viewRanking() {
  const ev = currentEvent();
  if (!ev) return noEvent();
  const games = finishedGames(ev);
  const st = stats(games);
  const pending = pendingGames(ev);
  const live = pending.length ? `<div class="card"><h2>En cours (${pending.length})</h2>${pending.map(g => `<div class="game">
      <div>${teamNames(g.a)}<br>${teamNames(g.b)}</div><span class="tag">Table ${g.table}</span></div>`).join('')}</div>` : '';
  if (!st.length) return live + `<div class="card muted">Aucune partie terminée dans cet événement pour l'instant.</div>`;
  // Ex aequo (mêmes points et victoires) : même rang, le suivant est décalé (1, 2, 2, 4)
  let rank = 0;
  const rows = st.map((p, i) => {
    const prev = st[i - 1];
    if (!prev || prev.pts !== p.pts || prev.wins !== p.wins) rank = i + 1;
    return `<tr><td><span class="rank">${rank}.</span> ${esc(p.name)}</td>
    <td>${p.games}</td><td>${p.wins}</td><td class="${rank === 1 && p.pts ? 'win' : ''}"><b>${p.pts}</b></td></tr>`;
  }).join('');
  const history = [...games].reverse().map(g => `<div class="game">
      <div><span class="${g.sa > g.sb ? 'win' : ''}">${teamNames(g.a)} <b>${g.sa}</b></span><br>
      <span class="${g.sb > g.sa ? 'win' : ''}">${teamNames(g.b)} <b>${g.sb}</b></span></div>
      <button class="ghost" onclick="delGame('${g.id}')">Suppr.</button></div>`).join('');
  return live + `<div class="card"><h2>Classement individuel</h2>
    <table><tr><th>Joueur</th><th>Parties</th><th>Vict.</th><th>Points</th></tr>${rows}</table></div>
    <div class="card"><h2>Historique (${games.length})</h2>${history}</div>`;
}

function select(field, label, atTable) {
  const taken = ['a1','a2','b1','b2'].filter(f => f !== field).map(f => draft[f]);
  const opts = sortedPlayers().map(p => {
    const t = atTable[p.id];
    return `<option value="${p.id}" ${draft[field] === p.id ? 'selected' : ''} ${taken.includes(p.id) || t ? 'disabled' : ''}>${esc(p.name)}${t ? ` (table ${t})` : ''}</option>`;
  }).join('');
  return `<select onchange="draft.${field}=this.value;render()" aria-label="${label}"><option value="">${label}</option>${opts}</select>`;
}

function viewGame() {
  const ev = currentEvent();
  if (!ev) return noEvent();
  if (state.players.length < 4) return `<div class="card muted">Il faut au moins 4 joueurs.</div>`;
  const pending = pendingGames(ev);
  const atTable = {};
  for (const g of pending) for (const id of [...g.a, ...g.b]) atTable[id] = g.table;
  const free = state.players.length - Object.keys(atTable).length;
  const scoreInput = (g, k, team) => `<input type="number" inputmode="numeric" min="0" step="10" placeholder="Points"
    aria-label="Points ${team} table ${g.table}" value="${scoreDraft[g.id]?.[k] ?? ''}"
    oninput="setScoreDraft('${g.id}','${k}',this.value)" onchange="this.value=setScoreDraft('${g.id}','${k}',r10(this.value))">`;
  const matches = pending.map(g => `<div class="card match"><h2><span>Table ${g.table}</span>
      <button class="ghost" onclick="cancelGame('${g.id}')">Annuler</button></h2>
      <div class="side"><span>${teamNames(g.a)}</span>${scoreInput(g, 'sa', 'équipe A')}</div>
      <div class="side"><span>${teamNames(g.b)}</span>${scoreInput(g, 'sb', 'équipe B')}</div>
      <div class="err">${esc(scoreDraft[g.id]?.err ?? '')}</div>
      <button class="btn" onclick="finishGame('${g.id}')">Valider le score</button></div>`).join('');
  const form = free < 4
    ? `<div class="card muted">Tous les joueurs sont à une table : saisissez un score pour en libérer.</div>`
    : `<div class="card"><h2>Nouveau match</h2>
    <div class="grid2">
      <div class="team"><b>Équipe A</b>${select('a1','Joueur 1',atTable)}${select('a2','Joueur 2',atTable)}
        <input type="number" inputmode="numeric" min="0" step="10" placeholder="Points A" aria-label="Points équipe A" value="${draft.sa}" oninput="draft.sa=this.value" onchange="draft.sa=this.value=r10(this.value)"></div>
      <div class="team"><b>Équipe B</b>${select('b1','Joueur 1',atTable)}${select('b2','Joueur 2',atTable)}
        <input type="number" inputmode="numeric" min="0" step="10" placeholder="Points B" aria-label="Points équipe B" value="${draft.sb}" oninput="draft.sb=this.value" onchange="draft.sb=this.value=r10(this.value)"></div>
    </div>
    <p class="muted">Laissez les scores vides pour lancer le match et saisir le score total à la fin.
    Les scores sont arrondis à la dizaine (ex. 1275 → 1280).</p>
    <div class="err">${esc(draft.err)}</div>
    <button class="btn" onclick="addGame()">Enregistrer</button></div>`;
  return (pending.length ? `<h2>Matchs en cours (${pending.length})</h2>` : '') + matches + form;
}

const r10 = v => v === '' ? '' : String(Math.round(Number(v) / 10) * 10);

// Scores valides arrondis, null si les deux sont vides (match en cours), ou message d'erreur
function checkScores(rawA, rawB) {
  if (rawA === '' && rawB === '') return null;
  if (rawA === '' || rawB === '') return 'Saisissez les deux scores.';
  const sa = Number(r10(rawA)), sb = Number(r10(rawB));
  if (sa < 0 || sb < 0 || !Number.isFinite(sa + sb)) return 'Scores invalides.';
  return { sa, sb };
}

function addGame() {
  const { a1, a2, b1, b2 } = draft;
  if (![a1, a2, b1, b2].every(Boolean)) return setErr('Choisissez les 4 joueurs.');
  const scores = checkScores(draft.sa, draft.sb);
  if (typeof scores === 'string') return setErr(scores);
  draft.err = '';
  act(async () => {
    await api('POST', 'games', { eventId:currentEvent()?.id, a:[a1, a2], b:[b1, b2], ...scores });
    draft = { a1:'', a2:'', b1:'', b2:'', sa:'', sb:'', err:'' };
    if (scores) tab = 'classement';   // match lancé : on reste ici pour préparer la table suivante
  });
}
function setScoreDraft(id, k, v) {
  (scoreDraft[id] ??= {})[k] = v;
  return v;
}
function finishGame(id) {
  const d = scoreDraft[id] ?? {};
  const scores = checkScores(d.sa ?? '', d.sb ?? '');
  if (!scores || typeof scores === 'string') {
    d.err = scores || 'Saisissez les deux scores.';
    scoreDraft[id] = d;
    return render();
  }
  act(async () => {
    await api('PATCH', 'games/' + id, scores);
    delete scoreDraft[id];
  });
}
function cancelGame(id) {
  const g = state.games.find(g => g.id === id);
  if (!g || !confirm(`Annuler le match de la table ${g.table} (${g.a.map(name).join(' & ')} contre ${g.b.map(name).join(' & ')}) ?`)) return;
  act(async () => { await api('DELETE', 'games/' + id); delete scoreDraft[id]; });
}
function setErr(m) { draft.err = m; render(); }
function delGame(id) {
  const g = state.games.find(g => g.id === id);
  if (!g || !confirm(`Supprimer la partie ${g.a.map(name).join(' & ')} ${g.sa} – ${g.sb} ${g.b.map(name).join(' & ')} ?`)) return;
  act(() => api('DELETE', 'games/' + id));
}

function viewPlayers() {
  const list = sortedPlayers().map(p => `<div class="game"><span>${esc(p.name)}</span>
    <button class="ghost" onclick="delPlayer('${p.id}')">Retirer</button></div>`).join('');
  return `<div class="card"><h2>Ajouter un joueur</h2>
    <form class="row" onsubmit="addPlayer(event)"><input id="pname" placeholder="Prénom" aria-label="Prénom" maxlength="40" autocomplete="off">
    <button class="btn fit">Ajouter</button></form></div>
    <div class="card"><h2>Joueurs (${state.players.length})</h2>${list || '<span class="muted">Aucun joueur.</span>'}
    <p class="muted">Les joueurs sont communs à tous les événements.</p></div>`;
}
function addPlayer(e) {
  e.preventDefault();
  const v = document.getElementById('pname').value.trim();
  if (!v) return;
  act(() => api('POST', 'players', { name:v })).then(() => document.getElementById('pname')?.focus());
}
function delPlayer(id) {
  act(() => api('DELETE', 'players/' + id));
}
function viewEvents() {
  const cur = currentEvent();
  const list = eventsRecentFirst().map(e => {
    const n = eventGames(e).length;
    return `<div class="game"><div><b>${esc(e.name)}</b>${e.id === cur?.id ? ' <span class="win">✓</span>' : ''}<br>
      <span class="muted" style="white-space:nowrap">${fmtDate(e.createdAt)} · ${n} partie${n > 1 ? 's' : ''}</span></div>
      <div class="actions">
        ${e.id === cur?.id ? '' : `<button class="link" onclick="openEvent('${e.id}')">Ouvrir</button>`}
        <button class="link" onclick="renameEvent('${e.id}')">Renommer</button>
        <button class="ghost" onclick="delEvent('${e.id}')">Suppr.</button>
      </div></div>`;
  }).join('');
  return `<div class="card"><h2>Nouvel événement</h2>
    <form class="row" onsubmit="addEvent(event)"><input id="ename" placeholder="Ex. Tournoi de Noël" aria-label="Nom de l'événement" maxlength="40" autocomplete="off">
    <button class="btn fit">Créer</button></form></div>
    <div class="card"><h2>Événements (${state.events.length})</h2>${list || '<span class="muted">Aucun événement.</span>'}</div>`;
}
function addEvent(e) {
  e.preventDefault();
  const v = document.getElementById('ename').value.trim();
  if (!v) return;
  act(async () => {
    const { created } = await api('POST', 'events', { name:v });
    pickEvent(created);
    tab = 'classement';
  });
}
function openEvent(id) { pickEvent(id); tab = 'classement'; render(); }
function renameEvent(id) {
  const ev = state.events.find(e => e.id === id);
  const v = ev && prompt("Nouveau nom de l'événement :", ev.name);
  if (v && v.trim() && v.trim() !== ev.name) act(() => api('PATCH', 'events/' + id, { name:v.trim() }));
}
function delEvent(id) {
  const ev = state.events.find(e => e.id === id);
  const n = eventGames(ev).length;
  const what = n === 0 ? '' : n === 1 ? ' et sa partie' : ` et ses ${n} parties`;
  if (!ev || !confirm(`Supprimer « ${ev.name} »${what} ? Cette action est définitive.`)) return;
  act(() => api('DELETE', 'events/' + id));
}

document.querySelector('nav').addEventListener('click', e => {
  if (e.target.dataset.tab) { tab = e.target.dataset.tab; render(); }
});
render();
refresh(true);
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
