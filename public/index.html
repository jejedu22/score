<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Belote</title>
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Belote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1d2b24; --muted:#6b7a72; --accent:#1f6b4a; --danger:#b3382c; --line:#e3ded2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121a16; --card:#1b2621; --ink:#e8efe9; --muted:#8fa196; --accent:#4cc38a; --danger:#e5746a; --line:#2b3a33; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 16px; font-size:20px; font-weight:700; }
  nav { display:flex; gap:6px; padding:0 16px 8px; }
  nav button { flex:1; padding:10px 4px; font-size:15px !important; border:0; border-radius:10px; background:var(--card); color:var(--ink); font:inherit; font-weight:600; }
  nav button.on { background:var(--accent); color:#fff; }
  main { padding:0 16px 40px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid var(--line); }
  h2 { margin:0 0 10px; font-size:17px; }
  input, select { font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); width:100%; }
  button.btn { padding:10px 14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--danger); border:0; font:inherit; padding:6px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .row > .fit { flex:0 0 auto; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .team { background:var(--bg); border-radius:12px; padding:10px; display:grid; gap:8px; }
  .team b { font-size:14px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:8px 4px; text-align:right; border-bottom:1px solid var(--line); }
  td:nth-child(-n+2), th:nth-child(-n+2) { text-align:left; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .rank { color:var(--muted); width:28px; }
  th button.sort { background:none; border:0; padding:0; font:inherit; color:inherit; cursor:pointer; white-space:nowrap; }
  th[aria-sort] button.sort { color:var(--ink); }
  .win { color:var(--accent); font-weight:700; }
  .muted { color:var(--muted); font-size:14px; }
  .game { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .game:last-child { border:0; }
  body.busy button { opacity:.5; pointer-events:none; }
  .eventbar { margin-bottom:12px; }
  .eventbar select { background:var(--card); font-weight:600; }
  .actions { display:flex; gap:2px; flex:0 0 auto; }
  button.link { background:transparent; color:var(--accent); border:0; font:inherit; padding:6px; }
  .match { border-left:4px solid var(--accent); }
  .match h2 { display:flex; justify-content:space-between; align-items:center; }
  .side { display:grid; grid-template-columns:1fr 110px; gap:8px; align-items:center; margin-bottom:8px; }
  .tag { font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px; }
  tr.clickable { cursor:pointer; }
  button.name { background:none; border:0; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
  .res { font-weight:700; font-size:13px; border-radius:6px; padding:1px 6px; }
  .res.v { color:#fff; background:var(--accent); }
  .res.d { color:var(--danger); border:1px solid var(--danger); }
  .res.n { color:var(--muted); border:1px solid var(--line); }
  .totals { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; text-align:center; }
  .totals b { display:block; font-size:22px; }
  .players-pick { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:4px 12px; margin:8px 0; }
  .players-pick label { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .players-pick input { width:auto; }
  details > summary { cursor:pointer; font-weight:700; font-size:17px; list-style:none; }
  details > summary::before { content:'▸ '; color:var(--muted); }
  details[open] > summary::before { content:'▾ '; }
  .ok { color:var(--accent); font-size:14px; }
  .upcoming .game { font-size:14px; }
  .err { color:var(--danger); font-size:14px; min-height:18px; }
</style>
</head>
<body>
<header>🃏 Score Belote <small id="status" role="status" style="color:var(--danger);font-size:13px"></small></header>
<nav>
  <button data-tab="classement" class="on">Classement</button>
  <button data-tab="partie">Partie</button>
  <button data-tab="joueurs">Joueurs</button>
  <button data-tab="evenements">Événements</button>
</nav>
<main id="app"></main>

<script>
let state = { events:[], players:[], games:[], rests:[] };
const EVENT_KEY = 'belote-evenement';
let eventId = (() => { try { return localStorage.getItem(EVENT_KEY) || ''; } catch { return ''; } })();
let tab = 'classement';
let playerView = null;
// Tri du tableau de classement (mémorisé sur l'appareil) ; 'rank' = classement officiel
const SORT_KEY = 'belote-tri';
const SORTS = {
  rank:  { label:'#',       first:1,  value:p => p.rank },
  name:  { label:'Joueur',  first:1,  value:p => p.name },
  games: { label:'Parties', first:-1, value:p => p.games },
  wins:  { label:'Vict.',   first:-1, value:p => p.wins },
  pts:   { label:'Points',  first:-1, value:p => p.pts },
};
let sort = (() => {
  try { const v = JSON.parse(localStorage.getItem(SORT_KEY)); if (SORTS[v?.key] && Math.abs(v.dir) === 1) return v; } catch {}
  return { key:'rank', dir:1 };
})();
function sortRanking(key) {
  // Nouveau critère : son sens naturel (alphabétique, ou du plus grand au plus petit) ; même critère : on inverse
  sort = sort.key === key ? { key, dir:-sort.dir } : { key, dir:SORTS[key].first };
  try { localStorage.setItem(SORT_KEY, JSON.stringify(sort)); } catch {}
  render();
}   // id du joueur dont la fiche est affichée (par-dessus l'onglet courant)
let draft = { a1:'', a2:'', b1:'', b2:'', sa:'', sb:'', err:'' };
// Scores en cours de saisie pour les matchs en cours, par id (survivent aux rafraîchissements)
let scoreDraft = {};
// Corrections de parties validées en cours d'édition, par id : { sa, sb, from:[sa, sb], err }
let fix = {};
// Formulaire de planification : joueurs cochés (null = tous), nombre de tours, dernier résultat
let planDraft = { players:null, rounds:'3', msg:'' };

// URLs relatives : fonctionne derrière Traefik, même sous un préfixe (StripPrefix)
async function api(method, url, body) {
  const r = await fetch('api/' + url, {
    method, headers: { 'Content-Type':'application/json' }, body: JSON.stringify(body ?? {}),
  }).catch(() => { throw new Error('Hors ligne : modification impossible.'); });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}
async function refresh(force) {
  try {
    const r = await fetch('api/state');
    if (!r.ok) throw new Error();
    const next = await r.json();
    const changed = JSON.stringify(next) !== JSON.stringify(state);
    state = next;
    const typing = ['INPUT', 'SELECT'].includes(document.activeElement?.tagName);
    if (changed && (force || !typing)) render();
    setOnline(!r.headers.get('X-Offline'));
  } catch { setOnline(false); }
}
// Une seule écriture à la fois : évite les doublons sur double clic
let busy = false;
async function act(fn) {
  if (busy) return;
  busy = true;
  document.body.classList.add('busy');
  try { await fn(); await refresh(true); }
  catch (e) { alert(e.message); await refresh(true); render(); }   // erreur : afficher l'état réel
  finally { busy = false; document.body.classList.remove('busy'); }
}
function setOnline(ok) { document.getElementById('status').textContent = ok ? '' : '⚠ hors ligne'; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Ordre alphabétique français (accents et majuscules ignorés : Émile entre Elsa et Félix)
const byName = (x, y) => x.name.localeCompare(y.name, 'fr', { sensitivity: 'base' });
const sortedPlayers = () => [...state.players].sort(byName);
const name = id => (state.players.find(p => p.id === id) || { name:'?' }).name;

// Événement affiché : le choix mémorisé sur cet appareil, sinon le plus récent
const eventsRecentFirst = () => [...state.events].sort((x, y) => y.createdAt - x.createdAt);
function currentEvent() {
  return state.events.find(e => e.id === eventId) || eventsRecentFirst()[0] || null;
}
function pickEvent(id) {
  eventId = id;
  try { localStorage.setItem(EVENT_KEY, id); } catch {}
  draft = { a1:'', a2:'', b1:'', b2:'', sa:'', sb:'', err:'' };
  render();
}
const eventGames = ev => state.games.filter(g => g.eventId === ev?.id);
const isPending = g => g.sa === null;
const finishedGames = ev => eventGames(ev).filter(g => !isPending(g)).sort((x, y) => x.finishedAt - y.finishedAt);
// Tour planifié en cours : le plus petit tour qui a encore des matchs sans score
function currentRound(ev) {
  const rounds = eventGames(ev).filter(g => isPending(g) && g.round !== null).map(g => g.round);
  return rounds.length ? Math.min(...rounds) : null;
}
// Matchs en cours : ceux ajoutés à la main et ceux du tour planifié en cours (pas les tours suivants)
function pendingGames(ev) {
  const round = currentRound(ev);
  return eventGames(ev).filter(g => isPending(g) && (g.round === null || g.round === round))
    .sort((x, y) => (x.round ?? Infinity) - (y.round ?? Infinity) || x.table - y.table);
}
const restsOf = (ev, round) => state.rests.filter(r => r.eventId === ev.id && r.round === round).map(r => name(r.playerId));
const tableLabel = g => g.round ? `Tour ${g.round} · Table ${g.table}` : `Table ${g.table}`;
const teamNames = ids => esc(ids.map(name).join(' & '));
const fmtDate = t => new Date(t).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });

function stats(games) {   // parties terminées uniquement
  const s = Object.fromEntries(state.players.map(p => [p.id, { id:p.id, name:p.name, pts:0, games:0, wins:0 }]));
  for (const g of games) {
    for (const [team, mine, theirs] of [[g.a, g.sa, g.sb], [g.b, g.sb, g.sa]]) {
      for (const id of team) {
        if (!s[id]) continue;
        s[id].pts += mine; s[id].games++;
        if (mine > theirs) s[id].wins++;
      }
    }
  }
  // Classement : victoires d'abord, puis points
  return Object.values(s).filter(p => p.games).sort((x, y) => y.wins - x.wins || y.pts - x.pts || byName(x, y));
}

// Rangs avec ex aequo (mêmes victoires et points) : même rang, le suivant est décalé (1, 2, 2, 4)
function withRanks(st) {
  let rank = 0;
  return st.map((p, i) => {
    const prev = st[i - 1];
    if (!prev || prev.wins !== p.wins || prev.pts !== p.pts) rank = i + 1;
    return { ...p, rank };
  });
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const app = document.getElementById('app');
  if (playerView && state.players.some(p => p.id === playerView)) { app.innerHTML = viewPlayer(playerView); return; }
  playerView = null;
  const view = { classement:viewRanking, partie:viewGame, joueurs:viewPlayers, evenements:viewEvents }[tab]();
  app.innerHTML = (tab === 'classement' || tab === 'partie' ? eventBar() : '') + view;
}

function eventBar() {
  const ev = currentEvent();
  if (!ev) return '';
  const opts = eventsRecentFirst().map(e =>
    `<option value="${e.id}" ${e.id === ev.id ? 'selected' : ''}>${esc(e.name)} · ${fmtDate(e.createdAt)}</option>`).join('');
  return `<div class="eventbar"><select onchange="pickEvent(this.value)" aria-label="Événement">${opts}</select></div>`;
}
const noEvent = () => `<div class="card muted">Créez d'abord un événement dans l'onglet « Événements ».</div>`;

function viewRanking() {
  const ev = currentEvent();
  if (!ev) return noEvent();
  const games = finishedGames(ev);
  const st = stats(games);
  const pending = pendingGames(ev);
  const live = pending.length ? `<div class="card"><h2>En cours (${pending.length})</h2>${pending.map(g => `<div class="game">
      <div>${teamNames(g.a)}<br>${teamNames(g.b)}</div><span class="tag">${tableLabel(g)}</span></div>`).join('')}</div>` : '';
  if (!st.length) return live + `<div class="card muted">Aucune partie terminée dans cet événement pour l'instant.</div>`;
  const { value } = SORTS[sort.key];
  const cmp = sort.key === 'name' ? (x, y) => byName(x, y) : (x, y) => value(x) - value(y);
  const ranked = withRanks(st).sort((x, y) => sort.dir * cmp(x, y) || x.rank - y.rank || byName(x, y));
  const rows = ranked.map(({ rank, ...p }) => {
    const lead = rank === 1 ? 'win' : '';
    return `<tr class="clickable" onclick="showPlayer('${p.id}')"><td class="rank">${rank}</td><td><button class="name">${esc(p.name)}</button></td>
    <td>${p.games}</td><td class="${lead}"><b>${p.wins}</b></td><td class="${lead}">${p.pts}</td></tr>`;
  }).join('');
  const history = [...games].reverse().map(g => fix[g.id] ? fixRow(g) : `<div class="game">
      <div><span class="${g.sa > g.sb ? 'win' : ''}">${teamNames(g.a)} <b>${g.sa}</b></span><br>
      <span class="${g.sb > g.sa ? 'win' : ''}">${teamNames(g.b)} <b>${g.sb}</b></span></div>
      <div class="actions"><button class="link" onclick="startFix('${g.id}')">Corriger</button>
      <button class="ghost" onclick="delGame('${g.id}')">Suppr.</button></div></div>`).join('');
  return live + `<div class="card"><h2>Classement individuel</h2>
    <table><tr>${Object.entries(SORTS).map(([key, { label }]) => {
      const on = sort.key === key;
      const aria = on ? ` aria-sort="${sort.dir === 1 ? 'ascending' : 'descending'}"` : '';
      return `<th${aria}><button class="sort" onclick="sortRanking('${key}')">${label}${on ? (sort.dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`;
    }).join('')}</tr>${rows}</table>
    <p class="muted">Rang : victoires, puis points. Touchez un en-tête pour trier, un joueur pour voir ses parties.</p></div>
    <div class="card"><h2>Historique (${games.length})</h2>${history}</div>`;
}

function select(field, label, atTable) {
  const taken = ['a1','a2','b1','b2'].filter(f => f !== field).map(f => draft[f]);
  const opts = sortedPlayers().map(p => {
    const t = atTable[p.id];
    return `<option value="${p.id}" ${draft[field] === p.id ? 'selected' : ''} ${taken.includes(p.id) || t ? 'disabled' : ''}>${esc(p.name)}${t ? ` (table ${t})` : ''}</option>`;
  }).join('');
  return `<select onchange="draft.${field}=this.value;render()" aria-label="${label}"><option value="">${label}</option>${opts}</select>`;
}

function viewGame() {
  const ev = currentEvent();
  if (!ev) return noEvent();
  if (state.players.length < 4) return `<div class="card muted">Il faut au moins 4 joueurs.</div>`;
  const pending = pendingGames(ev);
  const atTable = {};
  for (const g of pending) for (const id of [...g.a, ...g.b]) atTable[id] = g.table;
  const free = state.players.length - Object.keys(atTable).length;
  const scoreInput = (g, k, team) => `<input type="number" inputmode="numeric" min="0" step="10" placeholder="Points"
    aria-label="Points ${team} table ${g.table}" value="${scoreDraft[g.id]?.[k] ?? ''}"
    oninput="setScoreDraft('${g.id}','${k}',this.value)" onchange="this.value=setScoreDraft('${g.id}','${k}',r10(this.value))">`;
  const matches = pending.map(g => `<div class="card match"><h2><span>${tableLabel(g)}</span>
      <button class="ghost" onclick="cancelGame('${g.id}')">Annuler</button></h2>
      <div class="side"><span>${teamNames(g.a)}</span>${scoreInput(g, 'sa', 'équipe A')}</div>
      <div class="side"><span>${teamNames(g.b)}</span>${scoreInput(g, 'sb', 'équipe B')}</div>
      <div class="err">${esc(scoreDraft[g.id]?.err ?? '')}</div>
      <button class="btn" onclick="finishGame('${g.id}')">Valider le score</button></div>`).join('');
  const form = free < 4
    ? `<div class="card muted">Moins de 4 joueurs libres : saisissez un score pour en libérer, ou ajoutez des joueurs.</div>`
    : `<div class="card"><h2>Nouveau match</h2>
    <div class="grid2">
      <div class="team"><b>Équipe A</b>${select('a1','Joueur 1',atTable)}${select('a2','Joueur 2',atTable)}
        <input type="number" inputmode="numeric" min="0" step="10" placeholder="Points A" aria-label="Points équipe A" value="${draft.sa}" oninput="draft.sa=this.value" onchange="draft.sa=this.value=r10(this.value)"></div>
      <div class="team"><b>Équipe B</b>${select('b1','Joueur 1',atTable)}${select('b2','Joueur 2',atTable)}
        <input type="number" inputmode="numeric" min="0" step="10" placeholder="Points B" aria-label="Points équipe B" value="${draft.sb}" oninput="draft.sb=this.value" onchange="draft.sb=this.value=r10(this.value)"></div>
    </div>
    <p class="muted">Laissez les scores vides pour lancer le match et saisir le score total à la fin.
    Les scores sont arrondis à la dizaine (ex. 1275 → 1280).</p>
    <div class="err">${esc(draft.err)}</div>
    <button class="btn" onclick="addGame()">Enregistrer</button></div>`;
  const round = currentRound(ev);
  const resting = round ? restsOf(ev, round) : [];
  const restNote = resting.length ? `<p class="muted">Au repos au tour ${round} : ${esc(resting.join(', '))}</p>` : '';
  return (pending.length ? `<h2>Matchs en cours (${pending.length})</h2>` : '') + restNote + matches
    + viewUpcoming(ev, round) + viewPlanner(ev) + form;
}

// Tours planifiés suivants, en aperçu
function viewUpcoming(ev, round) {
  const later = eventGames(ev).filter(g => isPending(g) && g.round !== null && g.round > round);
  if (!later.length) return '';
  const rounds = [...new Set(later.map(g => g.round))].sort((x, y) => x - y);
  return `<div class="card upcoming"><h2>À venir</h2>${rounds.map(r => {
    const rest = restsOf(ev, r);
    return `<p style="margin:10px 0 2px"><b>Tour ${r}</b>${rest.length ? ` <span class="muted">· repos : ${esc(rest.join(', '))}</span>` : ''}</p>`
      + later.filter(g => g.round === r).sort((x, y) => x.table - y.table).map(g =>
        `<div class="game"><span>${teamNames(g.a)} <span class="muted">contre</span> ${teamNames(g.b)}</span><span class="tag">Table ${g.table}</span></div>`).join('');
  }).join('')}
  <button class="ghost" style="margin-top:8px;padding-left:0" onclick="deletePlan()">Supprimer les tours non joués</button></div>`;
}

function viewPlanner(ev) {
  const chosen = planDraft.players ?? state.players.map(p => p.id);
  const n = chosen.length;
  const adhoc = eventGames(ev).some(g => isPending(g) && g.round === null);
  const info = n < 4 ? 'Cochez au moins 4 joueurs.'
    : `${n} joueurs : ${Math.floor(n / 4)} table${n >= 8 ? 's' : ''} par tour${n % 4 ? `, ${n % 4} au repos à tour de rôle` : ''}.`;
  const boxes = sortedPlayers().map(p => `<label><input type="checkbox" ${chosen.includes(p.id) ? 'checked' : ''}
    onchange="togglePlanPlayer('${p.id}', this.checked)">${esc(p.name)}</label>`).join('');
  return `<div class="card"><details ${planDraft.open ? 'open' : ''} ontoggle="planDraft.open=this.open">
    <summary>Planifier des tours</summary>
    <p class="muted">Les tables de chaque tour sont tirées automatiquement : personne ne rejoue avec un même partenaire
    tant que c'est possible (parties déjà jouées dans l'événement comprises), et les adversaires varient au maximum.</p>
    <div class="row"><span class="fit">Joueurs présents</span>
      <span class="fit"><button class="link" onclick="planAll(true)">Tous</button><button class="link" onclick="planAll(false)">Aucun</button></span></div>
    <div class="players-pick">${boxes}</div>
    <div class="row"><label class="fit" for="prounds">Nombre de tours</label>
      <input id="prounds" type="number" inputmode="numeric" min="1" max="30" value="${esc(planDraft.rounds)}"
        oninput="planDraft.rounds=this.value" style="max-width:90px"></div>
    <p class="muted">${info}</p>
    ${adhoc ? `<p class="err">Terminez ou annulez les matchs ajoutés à la main avant de planifier.</p>` : ''}
    <button class="btn" onclick="makePlan()" ${n < 4 || adhoc ? 'disabled' : ''}>Générer le planning</button>
  </details>${planDraft.msg ? `<p class="ok" style="margin:8px 0 0">${esc(planDraft.msg)}</p>` : ''}</div>`;
}
function togglePlanPlayer(id, on) {
  const cur = new Set(planDraft.players ?? state.players.map(p => p.id));
  on ? cur.add(id) : cur.delete(id);
  planDraft.players = [...cur];
  planDraft.msg = '';
  render();
}
function planAll(on) { planDraft.players = on ? null : []; planDraft.msg = ''; render(); }
function makePlan() {
  const ev = currentEvent();
  const players = (planDraft.players ?? state.players.map(p => p.id)).filter(id => state.players.some(p => p.id === id));
  const rounds = Number(planDraft.rounds);
  if (!Number.isInteger(rounds) || rounds < 1 || rounds > 30) return alert('Nombre de tours : entre 1 et 30.');
  act(async () => {
    const { plan } = await api('POST', `events/${ev.id}/plan`, { players, rounds });
    const span = plan.from === plan.to ? `Tour ${plan.from} planifié` : `Tours ${plan.from} à ${plan.to} planifiés`;
    planDraft.msg = `${span}. ` + (plan.partnerRepeats === 0
      ? 'Aucun partenaire répété.'
      : `${plan.partnerRepeats} association${plan.partnerRepeats > 1 ? 's' : ''} de partenaires répétée${plan.partnerRepeats > 1 ? 's' : ''} (le moins possible trouvé : trop de tours pour le nombre de joueurs).`);
    planDraft.open = false;
  });
}
function deletePlan() {
  if (!confirm('Supprimer les tours planifiés pas encore joués (y compris les tables du tour en cours sans score) ?')) return;
  act(() => api('DELETE', `events/${currentEvent().id}/plan`));
}

const r10 = v => v === '' ? '' : String(Math.round(Number(v) / 10) * 10);

// Scores valides arrondis, null si les deux sont vides (match en cours), ou message d'erreur
function checkScores(rawA, rawB) {
  if (rawA === '' && rawB === '') return null;
  if (rawA === '' || rawB === '') return 'Saisissez les deux scores.';
  const sa = Number(r10(rawA)), sb = Number(r10(rawB));
  if (sa < 0 || sb < 0 || !Number.isFinite(sa + sb)) return 'Scores invalides.';
  return { sa, sb };
}

function addGame() {
  const { a1, a2, b1, b2 } = draft;
  if (![a1, a2, b1, b2].every(Boolean)) return setErr('Choisissez les 4 joueurs.');
  const scores = checkScores(draft.sa, draft.sb);
  if (typeof scores === 'string') return setErr(scores);
  draft.err = '';
  act(async () => {
    await api('POST', 'games', { eventId:currentEvent()?.id, a:[a1, a2], b:[b1, b2], ...scores });
    draft = { a1:'', a2:'', b1:'', b2:'', sa:'', sb:'', err:'' };
    if (scores) tab = 'classement';   // match lancé : on reste ici pour préparer la table suivante
  });
}
function setScoreDraft(id, k, v) {
  (scoreDraft[id] ??= {})[k] = v;
  return v;
}
function finishGame(id) {
  const d = scoreDraft[id] ?? {};
  const scores = checkScores(d.sa ?? '', d.sb ?? '');
  if (!scores || typeof scores === 'string') {
    d.err = scores || 'Saisissez les deux scores.';
    scoreDraft[id] = d;
    return render();
  }
  act(async () => {
    await api('PATCH', 'games/' + id, scores);
    delete scoreDraft[id];
  });
}
function fixRow(g) {
  const f = fix[g.id];
  const input = (k, team) => `<input type="number" inputmode="numeric" min="0" step="10" aria-label="Points ${team}"
    value="${f[k]}" oninput="fix['${g.id}'].${k}=this.value" onchange="fix['${g.id}'].${k}=this.value=r10(this.value)">`;
  return `<div class="game" style="display:block">
    <div class="side"><span>${teamNames(g.a)}</span>${input('sa', 'équipe A')}</div>
    <div class="side"><span>${teamNames(g.b)}</span>${input('sb', 'équipe B')}</div>
    <div class="err">${esc(f.err ?? '')}</div>
    <div class="row"><button class="btn" onclick="saveFix('${g.id}')">Enregistrer la correction</button>
    <button class="link fit" onclick="delete fix['${g.id}'];render()">Annuler</button></div></div>`;
}
function startFix(id) {
  const g = state.games.find(g => g.id === id);
  if (!g) return;
  fix[id] = { sa:String(g.sa), sb:String(g.sb), from:[g.sa, g.sb] };
  render();
}
function saveFix(id) {
  const f = fix[id];
  const scores = checkScores(f.sa, f.sb);
  if (!scores || typeof scores === 'string') { f.err = scores || 'Saisissez les deux scores.'; return render(); }
  if (scores.sa === f.from[0] && scores.sb === f.from[1]) { delete fix[id]; return render(); }
  act(async () => {
    try { await api('PUT', `games/${id}/score`, { ...scores, from:f.from }); }
    catch (e) { delete fix[id]; throw e; }   // score changé ailleurs : on réaffiche la valeur à jour
    delete fix[id];
  });
}
function cancelGame(id) {
  const g = state.games.find(g => g.id === id);
  if (!g || !confirm(`Annuler le match de la table ${g.table} (${g.a.map(name).join(' & ')} contre ${g.b.map(name).join(' & ')}) ?`)) return;
  act(async () => { await api('DELETE', 'games/' + id); delete scoreDraft[id]; });
}
function setErr(m) { draft.err = m; render(); }
function delGame(id) {
  const g = state.games.find(g => g.id === id);
  if (!g || !confirm(`Supprimer la partie ${g.a.map(name).join(' & ')} ${g.sa} – ${g.sb} ${g.b.map(name).join(' & ')} ?`)) return;
  act(() => api('DELETE', 'games/' + id));
}

function viewPlayers() {
  const list = sortedPlayers().map(p => `<div class="game"><button class="name" onclick="showPlayer('${p.id}')">${esc(p.name)}</button>
    <button class="ghost" onclick="delPlayer('${p.id}')">Retirer</button></div>`).join('');
  return `<div class="card"><h2>Ajouter un joueur</h2>
    <form class="row" onsubmit="addPlayer(event)"><input id="pname" placeholder="Prénom" aria-label="Prénom" maxlength="40" autocomplete="off">
    <button class="btn fit">Ajouter</button></form></div>
    <div class="card"><h2>Joueurs (${state.players.length})</h2>${list || '<span class="muted">Aucun joueur.</span>'}
    <p class="muted">Les joueurs sont communs à tous les événements.</p></div>`;
}
function addPlayer(e) {
  e.preventDefault();
  const v = document.getElementById('pname').value.trim();
  if (!v) return;
  act(() => api('POST', 'players', { name:v })).then(() => document.getElementById('pname')?.focus());
}
function delPlayer(id) {
  act(() => api('DELETE', 'players/' + id));
}
function showPlayer(id) { playerView = id; render(); window.scrollTo(0, 0); }

// Fiche joueur : bilan global puis ses parties, groupées par événement (le plus récent d'abord)
function viewPlayer(id) {
  const me = state.players.find(p => p.id === id);
  const back = `<button class="link" style="padding:0 0 12px" onclick="playerView=null;render()">← Retour</button>`;
  const mine = g => g.a.includes(id) || g.b.includes(id);
  const total = { games:0, wins:0, pts:0 };
  const sections = eventsRecentFirst().map(ev => {
    const games = eventGames(ev).filter(mine);
    if (!games.length) return '';
    const st = withRanks(stats(finishedGames(ev))).find(p => p.id === id);
    if (st) { total.games += st.games; total.wins += st.wins; total.pts += st.pts; }
    // En cours d'abord, puis les parties terminées de la plus récente à la plus ancienne
    const when = g => g.finishedAt ?? Number.MAX_SAFE_INTEGER;
    games.sort((x, y) => when(y) - when(x));
    const rows = games.map(g => {
      const [team, opp] = g.a.includes(id) ? [g.a, g.b] : [g.b, g.a];
      const partner = name(team.find(x => x !== id));
      const vs = `avec <b>${esc(partner)}</b> · contre ${teamNames(opp)}`;
      if (isPending(g)) return `<div class="game"><div>${vs}</div><span class="tag">${tableLabel(g)}</span></div>`;
      const [mineScore, oppScore] = g.a.includes(id) ? [g.sa, g.sb] : [g.sb, g.sa];
      const res = mineScore > oppScore ? ['v', 'Victoire'] : mineScore < oppScore ? ['d', 'Défaite'] : ['n', 'Égalité'];
      return `<div class="game"><div>${vs}<br><b>${mineScore}</b> – ${oppScore}</div>
        <span class="res ${res[0]}">${res[1]}</span></div>`;
    }).join('');
    const summary = st
      ? `${st.rank}<sup>${st.rank === 1 ? 'er' : 'e'}</sup> · ${st.wins} victoire${st.wins > 1 ? 's' : ''} · ${st.pts} pts`
      : 'aucune partie terminée';
    return `<div class="card"><h2>${esc(ev.name)}</h2><p class="muted" style="margin:-6px 0 6px">${fmtDate(ev.createdAt)} · ${summary}</p>${rows}</div>`;
  }).join('');
  const rate = total.games ? Math.round(100 * total.wins / total.games) : 0;
  return back + `<div class="card"><h2>${esc(me.name)}</h2>
    <div class="totals"><div><b>${total.games}</b><span class="muted">parties</span></div>
    <div><b>${total.wins}</b><span class="muted">victoires</span></div>
    <div><b>${rate} %</b><span class="muted">réussite</span></div>
    <div><b>${total.pts}</b><span class="muted">points</span></div></div>
    <p class="muted" style="margin-bottom:0">Tous événements confondus, parties terminées.</p></div>`
    + (sections || `<div class="card muted">Aucune partie jouée pour l'instant.</div>`);
}

function viewEvents() {
  const cur = currentEvent();
  const list = eventsRecentFirst().map(e => {
    const n = finishedGames(e).length, todo = eventGames(e).length - n;
    return `<div class="game"><div><b>${esc(e.name)}</b>${e.id === cur?.id ? ' <span class="win">✓</span>' : ''}<br>
      <span class="muted" style="white-space:nowrap">${fmtDate(e.createdAt)} · ${n} partie${n > 1 ? 's' : ''}${todo ? ` · ${todo} à jouer` : ''}</span></div>
      <div class="actions">
        ${e.id === cur?.id ? '' : `<button class="link" onclick="openEvent('${e.id}')">Ouvrir</button>`}
        <button class="link" onclick="renameEvent('${e.id}')">Renommer</button>
        <button class="ghost" onclick="delEvent('${e.id}')">Suppr.</button>
      </div></div>`;
  }).join('');
  return `<div class="card"><h2>Nouvel événement</h2>
    <form class="row" onsubmit="addEvent(event)"><input id="ename" placeholder="Ex. Tournoi de Noël" aria-label="Nom de l'événement" maxlength="40" autocomplete="off">
    <button class="btn fit">Créer</button></form></div>
    <div class="card"><h2>Événements (${state.events.length})</h2>${list || '<span class="muted">Aucun événement.</span>'}</div>`;
}
function addEvent(e) {
  e.preventDefault();
  const v = document.getElementById('ename').value.trim();
  if (!v) return;
  act(async () => {
    const { created } = await api('POST', 'events', { name:v });
    pickEvent(created);
    tab = 'classement';
  });
}
function openEvent(id) { pickEvent(id); tab = 'classement'; render(); }
function renameEvent(id) {
  const ev = state.events.find(e => e.id === id);
  const v = ev && prompt("Nouveau nom de l'événement :", ev.name);
  if (v && v.trim() && v.trim() !== ev.name) act(() => api('PATCH', 'events/' + id, { name:v.trim() }));
}
function delEvent(id) {
  const ev = state.events.find(e => e.id === id);
  const n = eventGames(ev).length;
  const what = n === 0 ? '' : n === 1 ? ' et sa partie' : ` et ses ${n} parties`;
  if (!ev || !confirm(`Supprimer « ${ev.name} »${what} ? Cette action est définitive.`)) return;
  act(() => api('DELETE', 'events/' + id));
}

document.querySelector('nav').addEventListener('click', e => {
  if (e.target.dataset.tab) { tab = e.target.dataset.tab; playerView = null; render(); }
});
render();
refresh(true);
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
