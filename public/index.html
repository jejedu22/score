<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Belote</title>
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Belote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1d2b24; --muted:#6b7a72; --accent:#1f6b4a; --danger:#b3382c; --line:#e3ded2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121a16; --card:#1b2621; --ink:#e8efe9; --muted:#8fa196; --accent:#4cc38a; --danger:#e5746a; --line:#2b3a33; }
  }
  /* Jeux de couleurs par événement (attribut data-theme posé sur <html> selon l'événement affiché) */
  :root[data-theme=bleu] { --accent:#1d5fa8; }
  :root[data-theme=bordeaux] { --accent:#8e2440; }
  :root[data-theme=violet] { --accent:#5b3fa6; }
  :root[data-theme=orange] { --accent:#a8500a; }
  :root[data-theme=ardoise] { --accent:#3d4f63; }
  @media (prefers-color-scheme: dark) {
    :root[data-theme=bleu] { --accent:#6aa8ef; }
    :root[data-theme=bordeaux] { --accent:#e27d97; }
    :root[data-theme=violet] { --accent:#a991ef; }
    :root[data-theme=orange] { --accent:#f0a65b; }
    :root[data-theme=ardoise] { --accent:#9fb3c8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 16px; font-size:20px; font-weight:700; }
  nav { display:flex; gap:6px; padding:0 16px 8px; }
  nav button { flex:1; padding:10px 4px; font-size:15px !important; border:0; border-radius:10px; background:var(--card); color:var(--ink); font:inherit; font-weight:600; }
  nav button.on { background:var(--accent); color:#fff; }
  main { padding:0 16px 40px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid var(--line); }
  h2 { margin:0 0 10px; font-size:17px; }
  input, select { font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); width:100%; }
  button.btn { padding:10px 14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--danger); border:0; font:inherit; padding:6px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .row > .fit { flex:0 0 auto; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .team { background:var(--bg); border-radius:12px; padding:10px; display:grid; gap:8px; }
  .team b { font-size:14px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:8px 4px; text-align:right; border-bottom:1px solid var(--line); }
  td:nth-child(-n+2), th:nth-child(-n+2) { text-align:left; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .rank { color:var(--muted); width:28px; }
  th button.sort { background:none; border:0; padding:0; font:inherit; color:inherit; cursor:pointer; white-space:nowrap; }
  th[aria-sort] button.sort { color:var(--ink); }
  .win { color:var(--accent); font-weight:700; }
  .muted { color:var(--muted); font-size:14px; }
  .game { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .game:last-child { border:0; }
  body.busy button { opacity:.5; pointer-events:none; }
  .eventbar { margin-bottom:12px; }
  .eventbar select { background:var(--card); font-weight:600; }
  .actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:2px; flex:0 1 auto; }
  .game > div:first-child { min-width:0; }
  button.link { background:transparent; color:var(--accent); border:0; font:inherit; padding:6px; }
  .match { border-left:4px solid var(--accent); }
  .match h2 { display:flex; justify-content:space-between; align-items:center; }
  .side { display:grid; grid-template-columns:1fr 110px; gap:8px; align-items:center; margin-bottom:8px; }
  .tag { font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px; }
  .clickable { cursor:pointer; }
  button.name { background:none; border:0; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
  .res { font-weight:700; font-size:13px; border-radius:6px; padding:1px 6px; }
  .res.v { color:#fff; background:var(--accent); }
  .res.d { color:var(--danger); border:1px solid var(--danger); }
  .res.n { color:var(--muted); border:1px solid var(--line); }
  .totals { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; text-align:center; }
  .totals b { display:block; font-size:22px; }
  .players-pick { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:4px 12px; margin:8px 0; }
  .players-pick label { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .players-pick input { width:auto; }
  details > summary { cursor:pointer; font-weight:700; font-size:17px; list-style:none; }
  details > summary::before { content:'▸ '; color:var(--muted); }
  details[open] > summary::before { content:'▾ '; }
  .ok { color:var(--accent); font-size:14px; }
  .upcoming .game { font-size:14px; }
  .closed { border-color:var(--muted); color:var(--muted); font-size:14px; }
  .champion { font-size:18px; border:2px solid var(--accent); }
  tr.qualif td { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .badge { font-size:12px; font-weight:600; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--muted); }
  .seg { display:flex; flex-wrap:wrap; gap:4px; }
  .seg button { flex:1; min-width:0; padding:8px 6px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; font-size:14px; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .field { margin:8px 0; }
  .field > span { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .totals-live { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; text-align:center; margin:4px 0 8px; }
  .totals-live b { display:block; font-size:28px; }
  .deals { font-size:14px; margin-bottom:8px; }
  .deals td, .deals th { padding:4px; }
  .preview { font-weight:600; min-height:20px; margin:6px 0; }
  .swatch { width:34px; height:34px; border-radius:50%; border:3px solid transparent; flex:0 0 auto !important; padding:0; }
  .swatch.on { border-color:var(--ink); }
  .settings { background:var(--bg); border-radius:12px; padding:10px; margin:6px 0 10px; }
  .err { color:var(--danger); font-size:14px; min-height:18px; }
</style>
</head>
<body>
<header>🃏 Score Belote <small id="status" role="status" style="color:var(--danger);font-size:13px"></small></header>
<nav>
  <button data-tab="classement" class="on">Classement</button>
  <button data-tab="partie">Partie</button>
  <button data-tab="joueurs">Joueurs</button>
  <button data-tab="evenements">Événements</button>
</nav>
<main id="app"></main>

<script src="coinche.js"></script>
<script>
let state = { events:[], players:[], games:[], rests:[], teams:[], deals:[], roster:[] };
const EVENT_KEY = 'belote-evenement';
let eventId = (() => { try { return localStorage.getItem(EVENT_KEY) || ''; } catch { return ''; } })();
let tab = 'classement';
let playerView = null;   // id du joueur dont la fiche est affichée (par-dessus l'onglet courant)
// Tri du tableau de classement (mémorisé sur l'appareil) ; 'rank' = classement officiel
const SORT_KEY = 'belote-tri';
const SORTS = {
  rank:  { label:'#',       first:1,  value:p => p.rank },
  name:  { label:'Joueur',  first:1,  value:p => p.name },
  games: { label:'Parties', first:-1, value:p => p.games },
  wins:  { label:'Vict.',   first:-1, value:p => p.wins },
  pts:   { label:'Points',  first:-1, value:p => p.pts },
};
let sort = (() => {
  try { const v = JSON.parse(localStorage.getItem(SORT_KEY)); if (SORTS[v?.key] && Math.abs(v.dir) === 1) return v; } catch {}
  return { key:'rank', dir:1 };
})();
function sortRanking(key) {
  // Nouveau critère : son sens naturel (alphabétique, ou du plus grand au plus petit) ; même critère : on inverse
  sort = sort.key === key ? { key, dir:-sort.dir } : { key, dir:SORTS[key].first };
  try { localStorage.setItem(SORT_KEY, JSON.stringify(sort)); } catch {}
  render();
}
let draft = { a1:'', a2:'', b1:'', b2:'', ta:'', tb:'', sa:'', sb:'', err:'' };
// Scores en cours de saisie pour les matchs en cours, par id (survivent aux rafraîchissements)
let scoreDraft = {};
// Corrections de parties validées en cours d'édition, par id : { sa, sb, from:[sa, sb], err }
let fix = {};
// Formulaire de planification : joueurs cochés (null = tous), nombre de tours, dernier résultat
let planDraft = { players:null, rounds:'3', msg:'' };

// URLs relatives : fonctionne derrière Traefik, même sous un préfixe (StripPrefix)
async function api(method, url, body) {
  const r = await fetch('api/' + url, {
    method, headers: { 'Content-Type':'application/json' }, body: JSON.stringify(body ?? {}),
  }).catch(() => { throw new Error('Hors ligne : modification impossible.'); });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}
async function refresh(force) {
  try {
    const r = await fetch('api/state');
    if (!r.ok) throw new Error();
    const next = await r.json();
    const changed = JSON.stringify(next) !== JSON.stringify(state) || !loaded;
    state = next;
    if (!loaded) { loaded = true; if (sheetView) return onRoute(); }   // feuille ouverte par lien : aller sur son événement
    const typing = ['INPUT', 'SELECT'].includes(document.activeElement?.tagName);
    if (changed && (force || !typing)) render();
    setOnline(!r.headers.get('X-Offline'));
  } catch { setOnline(false); }
}
// Une seule écriture à la fois : évite les doublons sur double clic
let busy = false;
async function act(fn) {
  if (busy) return;
  busy = true;
  document.body.classList.add('busy');
  // Toujours redessiner : l'action a pu changer l'écran (onglet, brouillon) même si les données sont identiques
  try { await fn(); await refresh(true); render(); }
  catch (e) { alert(e.message); await refresh(true); render(); }   // erreur : afficher l'état réel
  finally { busy = false; document.body.classList.remove('busy'); }
}
function setOnline(ok) { document.getElementById('status').textContent = ok ? '' : '⚠ hors ligne'; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Ordre alphabétique français (accents et majuscules ignorés : Émile entre Elsa et Félix)
const byName = (x, y) => x.name.localeCompare(y.name, 'fr', { sensitivity: 'base' });
const sortedPlayers = () => [...state.players].sort(byName);
// Joueurs inscrits à un événement (chaque événement a sa liste ; un joueur garde son identité de l'un à l'autre)
const rosterIds = ev => state.roster.filter(r => r.eventId === ev?.id).map(r => r.playerId);
const rosterPlayers = ev => { const ids = new Set(rosterIds(ev)); return sortedPlayers().filter(p => ids.has(p.id)); };
const name = id => (state.players.find(p => p.id === id) || { name:'?' }).name;

// Événement affiché : le choix mémorisé sur cet appareil, sinon le plus récent
const eventsRecentFirst = () => [...state.events].sort((x, y) => y.createdAt - x.createdAt);
function currentEvent() {
  return state.events.find(e => e.id === eventId) || eventsRecentFirst()[0] || null;
}
function pickEvent(id) {
  eventId = id;
  try { localStorage.setItem(EVENT_KEY, id); } catch {}
  draft = { a1:'', a2:'', b1:'', b2:'', ta:'', tb:'', sa:'', sb:'', err:'' };
  // Sélections propres à l'événement précédent
  pickExisting = new Set();
  planDraft.players = null;
  teamDraft = { p1:'', p2:'', name:'' };
  render();
}
const eventGames = ev => state.games.filter(g => g.eventId === ev?.id);
const isPending = g => g.sa === null;
const finishedGames = ev => eventGames(ev).filter(g => !isPending(g)).sort((x, y) => x.finishedAt - y.finishedAt);
// Tour planifié en cours : le plus petit tour qui a encore des matchs sans score
function currentRound(ev) {
  const rounds = eventGames(ev).filter(g => isPending(g) && g.round !== null).map(g => g.round);
  return rounds.length ? Math.min(...rounds) : null;
}
// Matchs en cours : ceux ajoutés à la main et ceux du tour planifié en cours (pas les tours suivants)
function pendingGames(ev) {
  const round = currentRound(ev);
  return eventGames(ev).filter(g => isPending(g) && (g.round === null || g.round === round))
    .sort((x, y) => (x.round ?? Infinity) - (y.round ?? Infinity) || x.table - y.table);
}
const isTeamEvent = ev => ev?.mode === 'team';
const isClosed = ev => !!ev?.closedAt;
const eventTeams = ev => state.teams.filter(t => t.eventId === ev?.id).sort(byName);
const teamOf = id => state.teams.find(t => t.id === id);
// Joueurs au repos ; en mode équipe on affiche l'équipe exemptée
function restsOf(ev, round) {
  const ids = state.rests.filter(r => r.eventId === ev.id && r.round === round).map(r => r.playerId);
  if (!isTeamEvent(ev)) return ids.map(name);
  return [...new Set(ids.map(id => eventTeams(ev).find(t => t.players.includes(id))?.name ?? name(id)))];
}
const KO_NAMES = { 32:'16e de finale', 16:'8e de finale', 8:'Quart de finale', 4:'Demi-finale', 2:'Finale' };
const groupName = i => `Poule ${String.fromCharCode(65 + i)}`;
function tableLabel(g) {
  if (g.stage === 'ko') return g.ko > 2 ? `${KO_NAMES[g.ko]} · Match ${g.slot + 1}` : KO_NAMES[g.ko];
  if (g.stage === 'group') return `${groupName(g.grp)} · Tour ${g.round} · Table ${g.table}`;
  return g.round ? `Tour ${g.round} · Table ${g.table}` : `Table ${g.table}`;
}
const teamNames = ids => esc(ids.filter(Boolean).map(name).join(' & '));
// Joueurs d'une équipe, seulement si son nom ne les cite pas déjà (nom par défaut « A & B »)
const teamPlayers = (t, wrap) => {
  const ids = t.players.filter(Boolean);
  return !ids.length || t.name === ids.map(name).join(' & ') ? '' : wrap(teamNames(ids));
};
// Un camp d'une partie : nom de l'équipe fixe (mode équipe) ou noms des deux joueurs
function side(g, k) {
  const team = teamOf(k === 'a' ? g.teamA : g.teamB);
  return team ? `${esc(team.name)}` : teamNames(k === 'a' ? g.a : g.b);
}
const fmtDate = t => new Date(t).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });

function stats(games) {   // parties terminées uniquement
  const s = Object.fromEntries(state.players.map(p => [p.id, { id:p.id, name:p.name, pts:0, games:0, wins:0 }]));
  for (const g of games) {
    for (const [team, mine, theirs] of [[g.a, g.sa, g.sb], [g.b, g.sb, g.sa]]) {
      for (const id of team) {
        if (!s[id]) continue;
        s[id].pts += mine; s[id].games++;
        if (mine > theirs) s[id].wins++;
      }
    }
  }
  // Classement : victoires d'abord, puis points
  return Object.values(s).filter(p => p.games).sort((x, y) => y.wins - x.wins || y.pts - x.pts || byName(x, y));
}

function teamStats(ev, games) {
  const s = Object.fromEntries(eventTeams(ev).map(t => [t.id, { id:t.id, name:t.name, players:t.players, pts:0, games:0, wins:0, diff:0 }]));
  for (const g of games) {
    for (const [t, mine, theirs] of [[g.teamA, g.sa, g.sb], [g.teamB, g.sb, g.sa]]) {
      if (!s[t]) continue;
      s[t].pts += mine; s[t].games++; s[t].diff += mine - theirs;
      if (mine > theirs) s[t].wins++;
    }
  }
  return Object.values(s);
}

// Rangs avec ex aequo (mêmes victoires et points) : même rang, le suivant est décalé (1, 2, 2, 4)
function withRanks(st) {
  let rank = 0;
  return st.map((p, i) => {
    const prev = st[i - 1];
    if (!prev || prev.wins !== p.wins || prev.pts !== p.pts) rank = i + 1;
    return { ...p, rank };
  });
}

const THEMES = { vert:'#1f6b4a', bleu:'#1d5fa8', bordeaux:'#8e2440', violet:'#5b3fa6', orange:'#a8500a', ardoise:'#3d4f63' };
function applyTheme() {
  const theme = currentEvent()?.theme ?? 'vert';
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name=theme-color]').content = THEMES[theme] ?? THEMES.vert;
}

function render() {
  applyTheme();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const app = document.getElementById('app');
  if (sheetView) { app.innerHTML = viewSheet(sheetView); return; }
  if (playerView && state.players.some(p => p.id === playerView)) { app.innerHTML = viewPlayer(playerView); return; }
  playerView = null;
  const view = { classement:viewRanking, partie:viewGame, joueurs:viewPlayers, evenements:viewEvents }[tab]();
  app.innerHTML = (tab === 'evenements' ? '' : eventBar()) + view;
}

function eventBar() {
  const ev = currentEvent();
  if (!ev) return '';
  const opts = eventsRecentFirst().map(e =>
    `<option value="${e.id}" ${e.id === ev.id ? 'selected' : ''}>${esc(e.name)} · ${fmtDate(e.createdAt)}${isClosed(e) ? ' · clos' : ''}</option>`).join('');
  return `<div class="eventbar"><select onchange="pickEvent(this.value)" aria-label="Événement">${opts}</select></div>`;
}
const noEvent = () => `<div class="card muted">Créez d'abord un événement dans l'onglet « Événements ».</div>`;

// Score en direct d'une partie saisie donne par donne
function liveScore(g) {
  const deals = gameDeals(g);
  if (!deals.length) return '';
  const [sa, sb] = dealTotals(deals);
  return `<div style="text-align:center"><b>${sa}</b><br><b>${sb}</b><br><span class="muted" style="font-size:12px">${deals.length} donne${deals.length > 1 ? 's' : ''}</span></div>`;
}

function closedBanner(ev) {
  return isClosed(ev) ? `<div class="card closed">🔒 Événement clos le ${fmtDate(ev.closedAt)} : consultation seule.
    Il peut être rouvert dans l'onglet « Événements ».</div>` : '';
}

// Tableau de classement triable : joueurs (fiche cliquable) ou équipes
function rankingTable(rows, { title, label, onRow, note }) {
  const { value } = SORTS[sort.key];
  const cmp = sort.key === 'name' ? byName : (x, y) => value(x) - value(y);
  const ranked = withRanks(rows).sort((x, y) => sort.dir * cmp(x, y) || x.rank - y.rank || byName(x, y));
  const body = ranked.map(({ rank, ...p }) => {
    const lead = rank === 1 ? 'win' : '';
    const who = onRow ? `<button class="name">${esc(p.name)}</button>`
      : `${esc(p.name)}${p.players ? teamPlayers(p, x => `<br><span class="muted">${x}</span>`) : ''}`;
    return `<tr${onRow ? ` class="clickable" onclick="${onRow}('${p.id}')"` : ''}><td class="rank">${rank}</td><td>${who}</td>
    <td>${p.games}</td><td class="${lead}"><b>${p.wins}</b></td><td class="${lead}">${p.pts}</td></tr>`;
  }).join('');
  const head = Object.entries(SORTS).map(([key, s]) => {
    const on = sort.key === key;
    const aria = on ? ` aria-sort="${sort.dir === 1 ? 'ascending' : 'descending'}"` : '';
    return `<th${aria}><button class="sort" onclick="sortRanking('${key}')">${key === 'name' ? label : s.label}${on ? (sort.dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`;
  }).join('');
  return `<div class="card"><h2>${title}</h2><table><tr>${head}</tr>${body}</table><p class="muted">${note}</p></div>`;
}

// Classement d'une poule : victoires, points, écart (comme le serveur pour les qualifications)
function groupStandings(ev, g) {
  const teams = eventTeams(ev).filter(t => t.grp === g);
  const games = finishedGames(ev).filter(x => x.stage === 'group' && x.grp === g);
  return teamStats(ev, games).filter(t => teams.some(x => x.id === t.id))
    .sort((x, y) => y.wins - x.wins || y.pts - x.pts || y.diff - x.diff);
}
function groupCards(ev) {
  const perGroup = ev.koSize / ev.groups;
  return Array.from({ length: ev.groups }, (_, g) => {
    const rows = groupStandings(ev, g).map((t, i) => `<tr class="${i < perGroup ? 'qualif' : ''}"><td class="rank">${i + 1}</td>
      <td>${esc(t.name)}${teamPlayers(t, x => `<br><span class="muted">${x}</span>`)}</td><td>${t.games}</td><td><b>${t.wins}</b></td>
      <td>${t.pts}</td><td>${t.diff > 0 ? '+' : ''}${t.diff}</td></tr>`).join('');
    return `<div class="card"><h2>${groupName(g)}</h2><table><tr><th>#</th><th>Équipe</th><th>J</th><th>V</th><th>Pts</th><th>Écart</th></tr>${rows}</table></div>`;
  }).join('') + `<p class="muted" style="margin-top:-4px">Surlignées : places qualificatives (${perGroup} par poule). Départage : victoires, points, puis écart.</p>`;
}
function bracketCard(ev) {
  const ko = eventGames(ev).filter(g => g.stage === 'ko');
  if (!ko.length) return '';
  const sizes = [...new Set(ko.map(g => g.ko))].sort((x, y) => y - x);
  const final = ko.find(g => g.ko === 2 && !isPending(g));
  const champion = final && teamOf(final.sa > final.sb ? final.teamA : final.teamB);
  return (champion ? `<div class="card champion">🏆 Vainqueur : <b>${esc(champion.name)}</b>
      ${teamPlayers(champion, x => `<span class="muted">(${x})</span>`)}</div>` : '')
    + `<div class="card"><h2>Phase finale</h2>${sizes.map(size => `<p style="margin:10px 0 2px"><b>${KO_NAMES[size]}${size > 2 ? 's' : ''}</b></p>`
      + ko.filter(g => g.ko === size).sort((x, y) => x.slot - y.slot).map(g => isPending(g)
        ? `<div class="game"><span>${side(g, 'a')} <span class="muted">contre</span> ${side(g, 'b')}</span><span class="tag">à jouer</span></div>`
        : `<div class="game"><span><span class="${g.sa > g.sb ? 'win' : ''}">${side(g, 'a')} ${g.sa}</span> – <span class="${g.sb > g.sa ? 'win' : ''}">${g.sb} ${side(g, 'b')}</span></span></div>`
      ).join('')).join('')}</div>`;
}

function viewRanking() {
  const ev = currentEvent();
  if (!ev) return noEvent();
  const games = finishedGames(ev);
  const pending = pendingGames(ev);
  const live = pending.length ? `<div class="card"><h2>En cours (${pending.length})</h2>${pending.map(g => `<div class="game clickable" onclick="openSheet('${g.id}')">
      <div>${side(g, 'a')}<br>${side(g, 'b')}</div>${liveScore(g)}<span class="tag">${tableLabel(g)}</span></div>`).join('')}</div>` : '';
  let main = '';
  if (isTeamEvent(ev)) {
    if (ev.groups) main += bracketCard(ev) + groupCards(ev);
    const st = teamStats(ev, games).filter(t => t.games).sort((x, y) => y.wins - x.wins || y.pts - x.pts || byName(x, y));
    if (st.length) main += rankingTable(st, { title: ev.groups ? 'Bilan des équipes (tout le tournoi)' : 'Classement par équipe',
      label: 'Équipe', note: 'Rang : victoires, puis points. Touchez un en-tête pour trier.' });
  } else {
    const st = stats(games);
    if (st.length) main += rankingTable(st, { title: 'Classement individuel', label: 'Joueur', onRow: 'showPlayer',
      note: 'Rang : victoires, puis points. Touchez un en-tête pour trier, un joueur pour voir ses parties.' });
  }
  if (!games.length && !ev.groups) main += `<div class="card muted">Aucune partie terminée dans cet événement pour l'instant.</div>`;
  const history = [...games].reverse().map(g => fix[g.id] ? fixRow(g) : `<div class="game">
      <div>${g.stage ? `<span class="muted" style="font-size:13px">${tableLabel(g)}</span><br>` : ''}
      <span class="${g.sa > g.sb ? 'win' : ''}">${side(g, 'a')} <b>${g.sa}</b></span><br>
      <span class="${g.sb > g.sa ? 'win' : ''}">${side(g, 'b')} <b>${g.sb}</b></span></div>
      ${gameDeals(g).length ? `<br><span class="muted" style="font-size:13px">${gameDeals(g).length} donnes</span>` : ''}
      ${gameDeals(g).length ? `<button class="link" style="padding:0" onclick="openSheet('${g.id}')">Feuille de points</button>` : ''}
      ${isClosed(ev) ? '' : `<div class="actions">
      <button class="link" onclick="startFix('${g.id}')">Corriger</button>
      ${g.stage ? '' : `<button class="ghost" onclick="delGame('${g.id}')">Suppr.</button>`}</div>`}</div>`).join('');
  return closedBanner(ev) + live + main
    + (games.length ? `<div class="card"><h2>Historique (${games.length})</h2>${history}</div>` : '');
}

function select(field, label, atTable) {
  const taken = ['a1','a2','b1','b2'].filter(f => f !== field).map(f => draft[f]);
  const opts = rosterPlayers(currentEvent()).map(p => {
    const t = atTable[p.id];
    return `<option value="${p.id}" ${draft[field] === p.id ? 'selected' : ''} ${taken.includes(p.id) || t ? 'disabled' : ''}>${esc(p.name)}${t ? ` (table ${t})` : ''}</option>`;
  }).join('');
  return `<select onchange="draft.${field}=this.value;render()" aria-label="${label}"><option value="">${label}</option>${opts}</select>`;
}

function viewGame() {
  const ev = currentEvent();
  if (!ev) return noEvent();
  if (isClosed(ev)) return closedBanner(ev);
  const pending = pendingGames(ev);
  const round = currentRound(ev);
  const resting = round ? restsOf(ev, round) : [];
  const restNote = resting.length ? `<p class="muted">${isTeamEvent(ev) ? 'Exemptée' + (resting.length > 1 ? 's' : '') : 'Au repos'}
    au tour ${round} : ${esc(resting.join(', '))}</p>` : '';
  const note = finishedNote ? `<div class="card champion" style="font-size:16px">${finishedNote}
    <button class="link" style="padding:0 0 0 6px" onclick="finishedNote='';render()">OK</button></div>` : '';
  const header = note + rulesNote(ev) + (pending.length ? `<h2>Matchs en cours (${pending.length})</h2>` : '') + restNote + matchCards(pending, ev);
  if (isTeamEvent(ev)) return ev.groups
    ? header + viewUpcoming(ev, round) + viewTournament(ev) + viewTeams(ev)
    : viewTeams(ev) + header + teamMatchForm(ev, pending) + viewTournament(ev);   // d'abord former les équipes
  const roster = rosterPlayers(ev);
  if (roster.length < 4) return header + `<div class="card muted">Il faut au moins 4 joueurs inscrits à cet événement
    (onglet « Joueurs »).</div>`;
  const atTable = {};
  for (const g of pending) for (const id of [...g.a, ...g.b]) atTable[id] = g.table;
  const free = roster.filter(p => !atTable[p.id]).length;
  const form = free < 4
    ? `<div class="card muted">Moins de 4 joueurs libres : saisissez un score pour en libérer, ou ajoutez des joueurs.</div>`
    : `<div class="card"><h2>Nouveau match</h2>
    <div class="grid2">
      <div class="team"><b>Équipe A</b>${select('a1','Joueur 1',atTable)}${select('a2','Joueur 2',atTable)}
        ${byDeals() ? '' : `<input type="number" inputmode="numeric" min="0" step="${scoreStep()}" placeholder="Points A" aria-label="Points équipe A" value="${draft.sa}" oninput="draft.sa=this.value" onchange="draft.sa=this.value=r10(this.value)">`}</div>
      <div class="team"><b>Équipe B</b>${select('b1','Joueur 1',atTable)}${select('b2','Joueur 2',atTable)}
        ${byDeals() ? '' : `<input type="number" inputmode="numeric" min="0" step="${scoreStep()}" placeholder="Points B" aria-label="Points équipe B" value="${draft.sb}" oninput="draft.sb=this.value" onchange="draft.sb=this.value=r10(this.value)">`}</div>
    </div>
    <p class="muted">${scoreHelp()}</p>
    <div class="err">${esc(draft.err)}</div>
    <button class="btn" onclick="addGame()">Enregistrer</button></div>`;
  return header + viewUpcoming(ev, round) + viewPlanner(ev) + form;
}

// Cartes de saisie des matchs en cours (les matchs du tournoi ne s'annulent pas un par un)
function rulesNote(ev) {
  if (ev.entry !== 'deals') return '';
  const end = ev.endType === 'points' ? `partie en ${ev.endValue} points` : `partie en ${ev.endValue} donne${ev.endValue > 1 ? 's' : ''}`;
  return `<p class="muted">Donne par donne · ${end} · ${ev.count === 'points' ? 'enchère + points faits' : 'enchère seule'}
    · ${ev.rounding ? 'arrondi à la dizaine' : 'sans arrondi'}</p>`;
}
function matchCards(pending, ev) {
  if (ev?.entry === 'deals') return pending.map(g => dealCard(g, ev)).join('');
  const scoreInput = (g, k, team) => `<input type="number" inputmode="numeric" min="0" step="${scoreStep()}" placeholder="Points"
    aria-label="Points ${team} ${tableLabel(g)}" value="${scoreDraft[g.id]?.[k] ?? ''}"
    oninput="setScoreDraft('${g.id}','${k}',this.value)" onchange="this.value=setScoreDraft('${g.id}','${k}',r10(this.value))">`;
  return pending.map(g => `<div class="card match"><h2><span>${tableLabel(g)}</span>
      ${g.stage ? '' : `<button class="ghost" onclick="cancelGame('${g.id}')">Annuler</button>`}</h2>
      <div class="side"><span>${side(g, 'a')}</span>${scoreInput(g, 'sa', 'équipe A')}</div>
      <div class="side"><span>${side(g, 'b')}</span>${scoreInput(g, 'sb', 'équipe B')}</div>
      <div class="err">${esc(scoreDraft[g.id]?.err ?? '')}</div>
      <button class="btn" onclick="finishGame('${g.id}')">Valider le score</button></div>`).join('');
}

// --- Saisie donne par donne (belote coinchée) ---
let dealDraft = {};   // par partie : { taker, contract, coinche, belote, points, made }
let finishedNote = '';  // résultat de la partie que la dernière donne vient de terminer
const gameDeals = g => state.deals.filter(d => d.gameId === g.id).sort((x, y) => x.idx - y.idx);
const dealTotals = deals => deals.reduce(([a, b], d) => [a + d.pa, b + d.pb], [0, 0]);
const sideShort = (g, k) => side(g, k);

// Carte compacte dans l'onglet Partie : score en direct et accès à la feuille de points
function dealCard(g, ev) {
  const deals = gameDeals(g);
  const [sa, sb] = dealTotals(deals);
  const goal = ev.endType === 'points' ? `objectif ${ev.endValue} pts` : `donne ${Math.min(deals.length + 1, ev.endValue)} sur ${ev.endValue}`;
  return `<div class="card match"><h2><span>${tableLabel(g)}</span>
      ${g.stage ? '' : `<button class="ghost" onclick="cancelGame('${g.id}')">Annuler</button>`}</h2>
    <div class="totals-live"><div>${side(g, 'a')}<b>${sa}</b></div><span class="muted">${deals.length} donne${deals.length > 1 ? 's' : ''}<br>${goal}</span><div>${side(g, 'b')}<b>${sb}</b></div></div>
    <button class="btn" style="width:100%" onclick="openSheet('${g.id}')">Feuille de points</button></div>`;
}

// Formulaire de la donne suivante (feuille de points)
function dealForm(g, ev) {
  const deals = gameDeals(g);
  const d = dealDraft[g.id] ??= { taker:'', contract:'', coinche:1, belote:'', points:'', made:null };
  const seg = (key, options) => `<div class="seg">${options.map(([v, label]) =>
    `<button type="button" class="${String(d[key]) === String(v) ? 'on' : ''}" onclick="setDeal('${g.id}','${key}',${JSON.stringify(v).replace(/"/g, "'")})">${label}</button>`).join('')}</div>`;
  const withPoints = ev.count === 'points' && Number(d.contract) !== Coinche.CAPOT;
  return `<div class="card"><h2>Donne ${deals.length + 1}</h2>
    <div class="field"><span>Preneur</span>${seg('taker', [['a', side(g, 'a')], ['b', side(g, 'b')]])}</div>
    <div class="field"><span>Contrat</span><select aria-label="Contrat" onchange="setDeal('${g.id}','contract',this.value)">
      <option value="">Choisir…</option>${Coinche.CONTRACTS.map(c => `<option value="${c}" ${String(d.contract) === String(c) ? 'selected' : ''}>${c === Coinche.CAPOT ? 'Capot (250)' : c}</option>`).join('')}</select></div>
    <div class="field"><span>Coinche</span>${seg('coinche', [[1, 'Non'], [2, 'Coinché ×2'], [4, 'Surcoinché ×4']])}</div>
    ${ev.count === 'points' ? `<div class="field"><span>Belote-rebelote (+20)</span>${seg('belote', [['', 'Aucune'], ['a', side(g, 'a')], ['b', side(g, 'b')]])}</div>` : ''}
    ${withPoints
      ? `<div class="field"><span>Points faits par le preneur (0 à 162, dix de der compris)</span>
        <input type="number" inputmode="numeric" min="0" max="162" value="${esc(d.points)}" aria-label="Points faits par le preneur"
          oninput="dealDraft['${g.id}'].points=this.value;dealPreview('${g.id}')"></div>`
      : `<div class="field"><span>Résultat${ev.count === 'contract' ? ' (belote comprise pour atteindre le contrat)' : ''}</span>${seg('made', [[true, 'Fait'], [false, 'Chuté']])}</div>`}
    <div class="preview" id="prev-${g.id}">${previewText(g, ev)}</div>
    <div class="err">${esc(d.err ?? '')}</div>
    <div class="row"><button class="btn" onclick="submitDeal('${g.id}')">Valider la donne</button>
    ${deals.length ? `<button class="link fit" onclick="undoDeal('${g.id}')">Annuler la dernière</button>` : ''}</div></div>`;
}

// --- Feuille de points : un écran par partie, à l'adresse #feuille/<id> (lien partageable) ---
let sheetView = null, sheetFromApp = false, loaded = false, wakeLock = null;
const sheetFromHash = () => (location.hash.match(/^#feuille\/([0-9a-f]{10})$/) || [])[1] || null;
function openSheet(id) { sheetFromApp = true; location.hash = 'feuille/' + id; }
function closeSheet() {
  if (sheetFromApp) return history.back();   // retour à l'écran d'où l'on vient
  history.replaceState(null, '', location.pathname + location.search);
  onRoute();
}
function onRoute() {
  sheetView = sheetFromHash();
  if (!sheetView) sheetFromApp = false;
  const g = state.games.find(x => x.id === sheetView);
  if (g && g.eventId !== eventId) { eventId = g.eventId; try { localStorage.setItem(EVENT_KEY, eventId); } catch {} }
  keepAwake();
  render();
  window.scrollTo(0, 0);
}
// Écran toujours allumé pendant qu'une feuille est ouverte (si le navigateur le permet)
async function keepAwake() {
  try {
    if (sheetView && !document.hidden && !wakeLock && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!sheetView && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
function shareSheet(id) {
  const url = location.href.split('#')[0] + '#feuille/' + id;
  if (navigator.share) return navigator.share({ title:'Feuille de points', url }).catch(() => {});
  navigator.clipboard?.writeText(url).then(() => alert('Lien de la feuille copié.'), () => prompt('Lien de la feuille :', url))
    ?? prompt('Lien de la feuille :', url);
}

function viewSheet(id) {
  const back = `<button class="link" style="padding:0 0 12px" onclick="closeSheet()">← Retour</button>`;
  const g = state.games.find(x => x.id === id);
  if (!g) return back + `<div class="card muted">${loaded ? 'Feuille introuvable : la partie a peut-être été supprimée.' : 'Chargement…'}</div>`;
  const ev = state.events.find(e => e.id === g.eventId);
  const deals = gameDeals(g);
  const finished = !isPending(g);
  const [sa, sb] = finished ? [g.sa, g.sb] : dealTotals(deals);
  const open = !isClosed(ev);
  const byDeal = ev.entry === 'deals' || deals.length;
  let status;
  if (finished) status = g.sa === g.sb ? 'Égalité' : `Vainqueur : ${side(g, g.sa > g.sb ? 'a' : 'b')}`;
  else if (byDeal) status = ev.endType === 'points' ? `Objectif ${ev.endValue} pts` : `Donne ${Math.min(deals.length + 1, ev.endValue)} sur ${ev.endValue}`;
  else status = 'En cours';
  let ca = 0, cb = 0;
  const rows = deals.map(x => {
    ca += x.pa; cb += x.pb;
    const detail = [x.made ? 'fait' : 'chuté', x.points !== null ? `${x.points} pts faits` : '', x.belote ? `belote ${side(g, x.belote)}` : '']
      .filter(Boolean).join(' · ');
    return `<tr><td>${x.idx + 1}</td><td style="text-align:left">${side(g, x.taker)} · ${x.contract === Coinche.CAPOT ? 'capot' : x.contract}${x.coinche > 1 ? ` ×${x.coinche}` : ''}
      <br><span class="muted">${detail}</span></td><td>${x.pa}<br><span class="muted">${ca}</span></td><td>${x.pb}<br><span class="muted">${cb}</span></td></tr>`;
  }).join('');
  const table = deals.length ? `<div class="card"><h2>Donnes</h2><table class="deals"><tr><th>#</th><th style="text-align:left">Preneur · contrat</th>
    <th>A</th><th>B</th></tr>${rows}</table><p class="muted" style="margin-bottom:0">En gris : total cumulé. A = ${side(g, 'a')}, B = ${side(g, 'b')}.</p></div>` : '';
  let action = '';
  if (!finished && open) action = byDeal ? dealForm(g, ev) : matchCards([g], { entry:'total' });
  if (finished && open && deals.length) action = `<p><button class="link" style="padding:0" onclick="undoDeal('${g.id}')">Annuler la dernière donne (reprendre la partie)</button></p>`;
  return back + `<div class="card ${finished ? 'champion' : ''}">
      <p class="muted" style="margin:0 0 4px">${esc(ev.name)} · ${tableLabel(g)}</p>
      <div class="totals-live"><div>${side(g, 'a')}<b>${sa}</b></div><span class="muted">${status}</span><div>${side(g, 'b')}<b>${sb}</b></div></div>
      ${rulesNote(ev).replace('<p class="muted">', '<p class="muted" style="margin:0">')}
      ${isClosed(ev) ? '<p class="muted" style="margin:6px 0 0">🔒 Événement clos : consultation seule.</p>' : ''}
    </div>` + action + table
    + `<p><button class="link" style="padding:0" onclick="shareSheet('${g.id}')">Partager le lien de cette feuille</button></p>`;
}

function draftDeal(d) {
  const beloteCounts = currentEvent()?.count === 'points';
  return { taker:d.taker, contract:Number(d.contract), coinche:Number(d.coinche), belote:(beloteCounts && d.belote) || null,
    points:d.points === '' ? null : Number(d.points), made:d.made };
}
function previewText(g, ev) {
  const d = dealDraft[g.id];
  const deal = draftDeal(d), settings = { count:ev.count, rounding:ev.rounding };
  if (!d.taker || !d.contract || Coinche.checkDeal(deal, settings)) return '';
  const r = Coinche.scoreDeal(deal, settings);
  return `${r.made ? 'Contrat fait' : 'Chuté'} → ${side(g, 'a')} +${r.pa} · ${side(g, 'b')} +${r.pb}`;
}
function dealPreview(id) {
  const el = document.getElementById('prev-' + id);
  const g = state.games.find(x => x.id === id);
  if (el && g) el.textContent = previewText(g, currentEvent()).replace(/&amp;/g, '&');
}
function setDeal(id, key, value) {
  const d = dealDraft[id];
  d[key] = value;
  d.err = '';
  render();
}
function submitDeal(id) {
  const ev = currentEvent(), g = state.games.find(x => x.id === id), d = dealDraft[id];
  const deal = draftDeal(d);
  const err = Coinche.checkDeal(deal, { count:ev.count, rounding:ev.rounding });
  if (err) { d.err = err; return render(); }
  act(async () => {
    const data = await api('POST', `games/${id}/deals`, { idx:gameDeals(g).length, ...deal });
    dealDraft[id] = { taker:'', contract:'', coinche:1, belote:'', points:'', made:null };
    const done = data.games.find(x => x.id === id);
    if (done?.sa !== null && !sheetView) {   // sur la feuille, le résultat est déjà affiché
      const winner = done.sa === done.sb ? 'Égalité' : `Vainqueur : ${side(g, done.sa > done.sb ? "a" : "b")}`;
      finishedNote = `Partie terminée (${tableLabel(g)}) : ${side(g, 'a')} ${done.sa} – ${done.sb} ${side(g, 'b')}. ${winner}.`;
    }
  });
}
function undoDeal(id) {
  const g = state.games.find(x => x.id === id);
  const last = gameDeals(g).at(-1);
  if (!last || !confirm(`Annuler la donne ${last.idx + 1} (${side(g, 'a')} +${last.pa}, ${side(g, 'b')} +${last.pb}) ?`.replace(/&amp;/g, '&'))) return;
  act(() => api('DELETE', `games/${id}/deals/last`));
}

// --- Mode équipe ---
let teamDraft = { p1:'', p2:'', name:'' };
let tourDraft = { groups:'2', koSize:'4' };

function viewTeams(ev) {
  const teams = eventTeams(ev);
  const locked = !!ev.groups;
  const list = teams.map(t => `<div class="game"><div><b>${esc(t.name)}</b>${t.grp !== null ? ` <span class="badge">${groupName(t.grp)}</span>` : ''}
      ${teamPlayers(t, x => `<br><span class="muted">${x}</span>`)}</div>
      <div class="actions"><button class="link" onclick="renameTeam('${t.id}')">Renommer</button>
      ${locked ? '' : `<button class="ghost" onclick="removeTeam('${t.id}')">Retirer</button>`}</div></div>`).join('');
  const taken = new Set(teams.flatMap(t => t.players));
  const pick = k => `<select onchange="teamDraft.${k}=this.value" aria-label="Joueur ${k === 'p1' ? 1 : 2} (facultatif)">
    <option value="">Joueur ${k === 'p1' ? 1 : 2}</option>${rosterPlayers(ev).filter(p => !taken.has(p.id)).map(p =>
      `<option value="${p.id}" ${teamDraft[k] === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`;
  const form = locked ? '<p class="muted">Le tournoi est lancé : les équipes sont figées.</p>'
    : `<div class="grid2" style="margin-top:8px">${pick('p1')}${pick('p2')}</div>
      <div class="row" style="margin-top:8px"><input placeholder="Nom de l'équipe" aria-label="Nom de l'équipe" maxlength="40"
        value="${esc(teamDraft.name)}" oninput="teamDraft.name=this.value">
      <button class="btn fit" onclick="addTeam()">Ajouter</button></div>`;
  return `<div class="card"><h2>Équipes (${teams.length})</h2>${list || '<p class="muted">Aucune équipe pour l\'instant.</p>'}${form}
    ${locked ? '' : '<p class="muted" style="margin-bottom:0">Un nom suffit : les joueurs sont facultatifs (choisis parmi ceux de l\'onglet « Joueurs »). Sans nom, l\'équipe prend celui de ses joueurs.</p>'}</div>`;
}

function teamMatchForm(ev, pending) {
  if (ev.groups) return '';
  const teams = eventTeams(ev);
  if (teams.length < 2) return '';
  const busy = {};
  for (const g of pending) for (const t of [g.teamA, g.teamB]) busy[t] = g.table;
  const pick = k => `<select onchange="draft.${k}=this.value;render()" aria-label="Équipe ${k === 'ta' ? 'A' : 'B'}">
    <option value="">Équipe ${k === 'ta' ? 'A' : 'B'}</option>${teams.map(t => {
      const other = draft[k === 'ta' ? 'tb' : 'ta'];
      return `<option value="${t.id}" ${draft[k] === t.id ? 'selected' : ''} ${busy[t.id] || other === t.id ? 'disabled' : ''}>${esc(t.name)}${busy[t.id] ? ` (table ${busy[t.id]})` : ''}</option>`;
    }).join('')}</select>`;
  const score = (k, l) => byDeals() ? '' : `<input type="number" inputmode="numeric" min="0" step="${scoreStep()}" placeholder="Points ${l}" aria-label="Points équipe ${l}"
    value="${draft[k]}" oninput="draft.${k}=this.value" onchange="draft.${k}=this.value=r10(this.value)">`;
  return `<div class="card"><h2>Match libre</h2><div class="grid2">
    <div class="team">${pick('ta')}${score('sa', 'A')}</div><div class="team">${pick('tb')}${score('sb', 'B')}</div></div>
    <p class="muted">${scoreHelp()}</p>
    <div class="err">${esc(draft.err)}</div><button class="btn" onclick="addTeamGame()">Enregistrer</button></div>`;
}

// Mêmes règles que le serveur (tournament.checkConfig), pour guider avant l'envoi
function tourCheck(n, groups, koSize) {
  if (!Number.isInteger(groups) || groups < 1 || groups > 16) return 'Nombre de poules : entre 1 et 16.';
  if (koSize % groups) return `${koSize} équipes qualifiées ne se répartissent pas entre ${groups} poules.`;
  const perGroup = koSize / groups, smallest = Math.floor(n / groups);
  if (smallest < 2) return `Il faut au moins 2 équipes par poule, soit ${2 * groups} équipes.`;
  if (smallest < perGroup) return `${perGroup} qualifiées par poule demandent au moins ${perGroup * groups} équipes.`;
  return null;
}

function viewTournament(ev) {
  const reset = `<button class="ghost" style="padding-left:0" onclick="resetTournament()">Réinitialiser le tournoi</button>`;
  if (!ev.groups) {
    const n = eventTeams(ev).length;
    const groups = Number(tourDraft.groups), koSize = Number(tourDraft.koSize);
    const err = tourCheck(n, groups, koSize);
    let info = err;
    if (!err) {
      const sizes = Array.from({ length: groups }, (_, g) => Math.floor(n / groups) + (g < n % groups ? 1 : 0));
      const matches = sizes.reduce((s, x) => s + x * (x - 1) / 2, 0);
      const rounds = Math.max(...sizes.map(x => (x % 2 ? x : x - 1)));
      const shape = [...new Set(sizes)].sort().reverse().join(' ou ');
      info = `${n} équipes : ${groups} poule${groups > 1 ? 's' : ''} de ${shape} · ${matches} matchs de poule en ${rounds} tour${rounds > 1 ? 's' : ''}
        · ${koSize / groups} qualifiée${koSize / groups > 1 ? 's' : ''} par poule → ${KO_NAMES[koSize].toLowerCase()}${koSize > 2 ? 's' : ''}.`;
    }
    const pending = eventGames(ev).some(isPending);
    const opts = [2, 4, 8, 16, 32].map(k => `<option value="${k}" ${koSize === k ? 'selected' : ''}>À partir des ${KO_NAMES[k].toLowerCase()}${k > 2 ? 's' : ''} (${k} équipes)</option>`).join('');
    return `<div class="card"><details ${tourDraft.open ? 'open' : ''} ontoggle="tourDraft.open=this.open">
      <summary>Tournoi : poules puis phase finale</summary>
      <p class="muted">Les poules sont tirées au sort ; chaque équipe rencontre toutes les autres équipes de sa poule.
      Les meilleures de chaque poule passent en phase finale, croisées avec les autres poules. Pas d'égalité en phase finale.</p>
      <div class="row"><label class="fit" for="tgroups">Nombre de poules</label>
        <input id="tgroups" type="number" inputmode="numeric" min="1" max="16" value="${esc(tourDraft.groups)}"
          onchange="tourDraft.groups=this.value;render()" style="max-width:90px"></div>
      <div style="margin-top:8px"><select aria-label="Phase finale" onchange="tourDraft.koSize=this.value;render()">${opts}</select></div>
      <p class="${err ? 'err' : 'muted'}">${esc(info)}</p>
      ${pending ? '<p class="err">Terminez ou annulez les matchs en cours avant de lancer le tournoi.</p>' : ''}
      <button class="btn" onclick="launchTournament()" ${err || pending ? 'disabled' : ''}>Lancer le tournoi</button>
    </details></div>`;
  }
  const games = eventGames(ev);
  const group = games.filter(g => g.stage === 'group');
  const groupLeft = group.filter(isPending).length;
  const ko = games.filter(g => g.stage === 'ko');
  const final = ko.find(g => g.ko === 2 && !isPending(g));
  if (final) {
    const champ = teamOf(final.sa > final.sb ? final.teamA : final.teamB);
    return `<div class="card champion">🏆 Vainqueur : <b>${esc(champ.name)}</b> ${teamPlayers(champ, x => `<span class="muted">(${x})</span>`)}
      <p style="margin-bottom:0"><button class="btn" onclick="closeEvent('${ev.id}')">Clore l'événement</button></p></div>`;
  }
  if (!ko.length && !groupLeft) {
    const perGroup = ev.koSize / ev.groups;
    const qualified = Array.from({ length: ev.groups }, (_, g) =>
      `<b>${groupName(g)}</b> : ${groupStandings(ev, g).slice(0, perGroup).map(t => esc(t.name)).join(', ')}`).join('<br>');
    return `<div class="card"><h2>Poules terminées</h2><p>${qualified}</p>
      <button class="btn" onclick="launchFinal()">Lancer la phase finale (${KO_NAMES[ev.koSize].toLowerCase()}${ev.koSize > 2 ? 's' : ''})</button>
      <p style="margin-bottom:0">${reset}</p></div>`;
  }
  const status = ko.length ? `Phase finale en cours : ${KO_NAMES[Math.min(...ko.filter(isPending).map(g => g.ko))]?.toLowerCase() ?? ''}.`
    : `Phase de poules : ${group.length - groupLeft} match${group.length - groupLeft > 1 ? 's' : ''} joué${group.length - groupLeft > 1 ? 's' : ''} sur ${group.length}.`;
  return `<div class="card"><h2>Tournoi</h2><p class="muted">${status} Classements dans l'onglet « Classement ».</p>${reset}</div>`;
}

        `<div class="game"><span>${side(g, 'a')} <span class="muted">contre</span> ${side(g, 'b')}</span><span class="tag">${g.stage === 'group' ? groupName(g.grp) + ' · ' : ''}Table ${g.table}</span></div>`).join('');

function togglePlanPlayer(id, on) {

function makePlan() {
  const ev = currentEvent();
  const players = (planDraft.players ?? rosterIds(ev)).filter(id => rosterIds(ev).includes(id));
  const rounds = Number(planDraft.rounds);
  if (!Number.isInteger(rounds) || rounds < 1 || rounds > 30) return alert('Nombre de tours : entre 1 et 30.');
  act(async () => {
    const { plan } = await api('POST', `events/${ev.id}/plan`, { players, rounds });
    const span = plan.from === plan.to ? `Tour ${plan.from} planifié` : `Tours ${plan.from} à ${plan.to} planifiés`;
    planDraft.msg = `${span}. ` + (plan.partnerRepeats === 0
      ? 'Aucun partenaire répété.'
      : `${plan.partnerRepeats} association${plan.partnerRepeats > 1 ? 's' : ''} de partenaires répétée${plan.partnerRepeats > 1 ? 's' : ''} (le moins possible trouvé : trop de tours pour le nombre de joueurs).`);

function deletePlan() {

// Arrondi à la dizaine si l'événement le demande (réglage « Arrondir les scores »)
const rounding = () => currentEvent()?.rounding !== false;
const scoreStep = () => (rounding() ? 10 : 1);
const r10 = v => (v === '' || !rounding() ? v : String(Math.round(Number(v) / 10) * 10));

const byDeals = () => currentEvent()?.entry === 'deals';
const scoreHelp = () => byDeals()
  ? 'Le score se saisit donne par donne une fois le match lancé (laissez les scores vides).'
  : 'Laissez les scores vides pour lancer le match et saisir le score total à la fin.'
    + (rounding() ? ' Les scores sont arrondis à la dizaine (ex. 1275 → 1280).' : '');

// Scores valides arrondis, null si les deux sont vides (match en cours), ou message d'erreur
function checkScores(rawA, rawB) {
  if (rawA === '' && rawB === '') return null;
  if (rawA === '' || rawB === '') return 'Saisissez les deux scores.';
  const sa = Number(r10(rawA)), sb = Number(r10(rawB));
  if (sa < 0 || sb < 0 || !Number.isFinite(sa + sb)) return 'Scores invalides.';
  return { sa, sb };
}

function addGame() {
  const { a1, a2, b1, b2 } = draft;
  if (![a1, a2, b1, b2].every(Boolean)) return setErr('Choisissez les 4 joueurs.');
  const scores = checkScores(draft.sa, draft.sb);
  if (typeof scores === 'string') return setErr(scores);
  draft.err = '';
  act(async () => {
    await api('POST', 'games', { eventId:currentEvent()?.id, a:[a1, a2], b:[b1, b2], ...scores });
    draft = { a1:'', a2:'', b1:'', b2:'', sa:'', sb:'', err:'' };
    if (scores) tab = 'classement';   // match lancé : on reste ici pour préparer la table suivante
  });
}
function setScoreDraft(id, k, v) {
  (scoreDraft[id] ??= {})[k] = v;
  return v;
}
function finishGame(id) {
  const d = scoreDraft[id] ?? {};
  let scores = checkScores(d.sa ?? '', d.sb ?? '');
  if (scores && typeof scores !== 'string' && state.games.find(g => g.id === id)?.stage === 'ko' && scores.sa === scores.sb)
    scores = "Pas d'égalité en phase finale : il faut un vainqueur.";
  if (!scores || typeof scores === 'string') {
    d.err = scores || 'Saisissez les deux scores.';
    scoreDraft[id] = d;

  act(async () => {
    await api('PATCH', 'games/' + id, scores);

}
function fixRow(g) {
  const f = fix[g.id];
  const input = (k, team) => `<input type="number" inputmode="numeric" min="0" step="${scoreStep()}" aria-label="Points ${team}"
    value="${f[k]}" oninput="fix['${g.id}'].${k}=this.value" onchange="fix['${g.id}'].${k}=this.value=r10(this.value)">`;
  return `<div class="game" style="display:block">
    <div class="side"><span>${side(g, 'a')}</span>${input('sa', 'équipe A')}</div>
    <div class="side"><span>${side(g, 'b')}</span>${input('sb', 'équipe B')}</div>
    <div class="err">${esc(f.err ?? '')}</div>
    <div class="row"><button class="btn" onclick="saveFix('${g.id}')">Enregistrer la correction</button>
    <button class="link fit" onclick="delete fix['${g.id}'];render()">Annuler</button></div></div>`;
}
function startFix(id) {
  const g = state.games.find(g => g.id === id);
  if (!g) return;
  fix[id] = { sa:String(g.sa), sb:String(g.sb), from:[g.sa, g.sb] };
  render();
}
function saveFix(id) {
  const f = fix[id];
  const scores = checkScores(f.sa, f.sb);
  if (!scores || typeof scores === 'string') { f.err = scores || 'Saisissez les deux scores.'; return render(); }
  if (scores.sa === f.from[0] && scores.sb === f.from[1]) { delete fix[id]; return render(); }
  act(async () => {
    try { await api('PUT', `games/${id}/score`, { ...scores, from:f.from }); }
    catch (e) { delete fix[id]; throw e; }   // score changé ailleurs : on réaffiche la valeur à jour
    delete fix[id];
  });
}
function cancelGame(id) {
  const g = state.games.find(g => g.id === id);
  if (!g || !confirm(`Annuler le match de la table ${g.table} (${g.a.map(name).join(' & ')} contre ${g.b.map(name).join(' & ')}) ?`)) return;
  act(async () => { await api('DELETE', 'games/' + id); delete scoreDraft[id]; });
}
function setErr(m) { draft.err = m; render(); }
function delGame(id) {
  const g = state.games.find(g => g.id === id);
  if (!g || !confirm(`Supprimer la partie ${g.a.map(name).join(' & ')} ${g.sa} – ${g.sb} ${g.b.map(name).join(' & ')} ?`)) return;
  act(() => api('DELETE', 'games/' + id));
}

// Joueurs de l'événement affiché ; on peut reprendre des joueurs d'autres événements
let pickExisting = new Set();

  if (!ev) return noEvent();
  const roster = rosterPlayers(ev);

  return step + `<div class="card"><h2>Ajouter un joueur</h2>

    <button class="btn fit">Ajouter</button></form>

    ${others.length ? `<div class="card"><details ${pickExisting.size ? 'open' : ''}><summary>Joueurs d'autres événements (${others.length})</summary>

// Fiche joueur : bilan global puis ses parties, groupées par événement (le plus récent d'abord)
function viewPlayer(id) {
  const me = state.players.find(p => p.id === id);
  const back = `<button class="link" style="padding:0 0 12px" onclick="playerView=null;render()">← Retour</button>`;
  const mine = g => g.a.includes(id) || g.b.includes(id);
  const total = { games:0, wins:0, pts:0 };
  const sections = eventsRecentFirst().map(ev => {
    const games = eventGames(ev).filter(mine);
    if (!games.length) return '';
    const st = withRanks(stats(finishedGames(ev))).find(p => p.id === id);
    if (st) { total.games += st.games; total.wins += st.wins; total.pts += st.pts; }
    // En cours d'abord, puis les parties terminées de la plus récente à la plus ancienne
    const when = g => g.finishedAt ?? Number.MAX_SAFE_INTEGER;
    games.sort((x, y) => when(y) - when(x));
    const rows = games.map(g => {
      const [team, opp] = g.a.includes(id) ? [g.a, g.b] : [g.b, g.a];
      const partner = name(team.find(x => x !== id));
      const vs = `avec <b>${esc(partner)}</b> · contre ${teamNames(opp)}`;
      if (isPending(g)) return `<div class="game clickable" onclick="openSheet('${g.id}')"><div>${vs}</div><span class="tag">${tableLabel(g)}</span></div>`;
      const [mineScore, oppScore] = g.a.includes(id) ? [g.sa, g.sb] : [g.sb, g.sa];
      const res = mineScore > oppScore ? ['v', 'Victoire'] : mineScore < oppScore ? ['d', 'Défaite'] : ['n', 'Égalité'];
      return `<div class="game"><div>${vs}<br><b>${mineScore}</b> – ${oppScore}</div>
        <span class="res ${res[0]}">${res[1]}</span></div>`;
    }).join('');
    const summary = st
      ? `${st.rank}<sup>${st.rank === 1 ? 'er' : 'e'}</sup> · ${st.wins} victoire${st.wins > 1 ? 's' : ''} · ${st.pts} pts`
      : 'aucune partie terminée';
    return `<div class="card"><h2>${esc(ev.name)}</h2><p class="muted" style="margin:-6px 0 6px">${fmtDate(ev.createdAt)} · ${summary}</p>${rows}</div>`;
  }).join('');
  const rate = total.games ? Math.round(100 * total.wins / total.games) : 0;
  return back + `<div class="card"><h2>${esc(me.name)}</h2>
    <div class="totals"><div><b>${total.games}</b><span class="muted">parties</span></div>
    <div><b>${total.wins}</b><span class="muted">victoires</span></div>
    <div><b>${rate} %</b><span class="muted">réussite</span></div>
    <div><b>${total.pts}</b><span class="muted">points</span></div></div>
    <p class="muted" style="margin-bottom:0">Tous événements confondus, parties terminées.</p></div>`
    + (sections || `<div class="card muted">Aucune partie jouée pour l'instant.</div>`);
}

function viewEvents() {
  const cur = currentEvent();
  const list = eventsRecentFirst().map(e => {
    const n = finishedGames(e).length, todo = eventGames(e).length - n;
    const kind = e.groups ? 'Tournoi' : isTeamEvent(e) ? 'Équipes' : 'Individuel';
    return `<div class="game"><div><b>${esc(e.name)}</b>${e.id === cur?.id ? ' <span class="win">✓</span>' : ''}
      <span class="badge">${kind}</span>${isClosed(e) ? ' <span class="badge">🔒 Clos</span>' : ''}<br>
      <span class="muted" style="white-space:nowrap">${fmtDate(e.createdAt)} · ${n} partie${n > 1 ? 's' : ''}${todo ? ` · ${todo} à jouer` : ''}</span></div>
      <div class="actions">
        ${e.id === cur?.id ? '' : `<button class="link" onclick="openEvent('${e.id}')">Ouvrir</button>`}
        <button class="link" onclick="toggleSettings('${e.id}')">Réglages</button>
        <button class="link" onclick="renameEvent('${e.id}')">Renommer</button>
        ${isClosed(e) ? `<button class="link" onclick="reopenEvent('${e.id}')">Rouvrir</button>`
          : `<button class="link" onclick="closeEvent('${e.id}')">Clore</button>`}
        <button class="ghost" onclick="delEvent('${e.id}')">Suppr.</button>
      </div></div>${settingsFor === e.id ? settingsPanel(e) : ''}`;
  }).join('');
  return `<div class="card"><h2>Nouvel événement</h2>
    <form onsubmit="addEvent(event)"><input id="ename" placeholder="Ex. Tournoi de Noël" aria-label="Nom de l'événement" maxlength="40" autocomplete="off">
    <div class="row" style="margin-top:8px"><select id="emode" aria-label="Mode">
      <option value="individual">Individuel</option>
      <option value="team">Équipes fixes</option></select>
    <button class="btn fit">Créer</button></div></form>
    <p class="muted" style="margin-bottom:0">Individuel : les partenaires changent à chaque partie, classement par joueur.
    Équipes fixes : paires inscrites au départ, classement par équipe, tournoi possible (poules puis phase finale).</p></div>
    <div class="card"><h2>Événements (${state.events.length})</h2>${list || '<span class="muted">Aucun événement.</span>'}</div>`;
}
// Réglages de partie d'un événement (un seul panneau ouvert à la fois)
let settingsFor = null, settingsDraft = null;
// Parcours de création d'un événement : 1. paramètres → 2. joueurs → 3. parties
let newSetup = null;   // id de l'événement en cours de création (null hors parcours)
const settingsOf = e => ({ entry:e.entry, endType:e.endType, endValue:String(e.endValue), count:e.count, rounding:e.rounding, theme:e.theme });
function toggleSettings(id) {
  settingsFor = settingsFor === id ? null : id;
  settingsDraft = null;
  newSetup = null;
  render();
}
function settingsPanel(e) {
  const s = settingsDraft ??= settingsOf(e);
  const intro = newSetup === e.id ? `<p class="muted" style="margin:0">Étape 1 sur 3</p><h2 style="margin-top:2px">Paramètres de « ${esc(e.name)} »</h2>
    <p class="muted" style="margin-top:-4px">Choisissez comment se jouent les parties. Tout reste modifiable plus tard (bouton « Réglages »).</p>` : '';
  const seg = (key, options) => `<div class="seg">${options.map(([v, label]) =>
    `<button type="button" class="${s[key] === v ? 'on' : ''}" onclick="settingsDraft.${key}=${JSON.stringify(v).replace(/"/g, "'")};${key === 'endType' ? `settingsDraft.endValue='${v === 'rounds' ? 8 : 1000}';` : ''}render()">${label}</button>`).join('')}</div>`;
  const locked = isClosed(e);
  return `<div class="settings">${intro}
    ${locked ? '<p class="muted" style="margin-top:0">Événement clos : seules les couleurs sont modifiables.</p>' : ''}
    <div class="field"><span>Saisie des scores</span>${seg('entry', [['total', 'Score final'], ['deals', 'Donne par donne']])}</div>
    ${s.entry === 'deals' ? `
    <div class="field"><span>Fin de partie</span>${seg('endType', [['points', 'En points'], ['rounds', 'En nombre de donnes']])}</div>
    <div class="field"><span>${s.endType === 'points' ? 'Objectif (points)' : 'Nombre de donnes'}</span>
      <input type="number" inputmode="numeric" min="1" value="${esc(s.endValue)}" oninput="settingsDraft.endValue=this.value" style="max-width:120px"></div>
    <div class="field"><span>Décompte d'une donne</span>${seg('count', [['contract', 'Enchère seule'], ['points', 'Enchère + points faits']])}</div>
    <p class="muted" style="margin:0">${s.count === 'points'
      ? 'Contrat réussi : le preneur marque contrat + ses points, la défense ses points (calculés automatiquement). Chute : la défense marque 160 + contrat.'
      : 'Contrat réussi : le preneur marque le contrat. Chute : la défense marque le contrat. La belote compte seulement pour atteindre le contrat (pas de points).'}
      Coinche ×2, surcoinche ×4${s.count === 'points' ? ' ; belote +20' : ''}.</p>` : ''}
    <label class="field" style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${s.rounding ? 'checked' : ''}
      onchange="settingsDraft.rounding=this.checked">Arrondir les scores à la dizaine</label>
    <div class="field"><span>Couleurs</span><div class="row" style="justify-content:flex-start;gap:10px">${Object.entries(THEMES).map(([k, c]) =>
      `<button type="button" class="swatch ${s.theme === k ? 'on' : ''}" style="background:${c}" aria-label="${k}" title="${k}"
        onclick="settingsDraft.theme='${k}';render()"></button>`).join('')}</div></div>
    <div class="row"><button class="btn" onclick="saveSettings('${e.id}')">${newSetup === e.id ? 'Enregistrer et continuer' : 'Enregistrer'}</button>
    ${newSetup === e.id ? '' : `<button class="link fit" onclick="toggleSettings('${e.id}')">Fermer</button>`}</div></div>`;
}
function saveSettings(id) {
  const s = settingsDraft;
  const e = state.events.find(x => x.id === id);
  // Événement clos : on n'envoie que les couleurs
  const body = isClosed(e) ? { theme:s.theme } : { ...s, endValue:Number(s.endValue) };
  act(async () => {
    await api('PATCH', 'events/' + id, { settings:body });
    settingsFor = null;
    if (newSetup === id) tab = 'joueurs';   // parcours de création : étape 2, les joueurs
  });
}

function addEvent(e) {
  e.preventDefault();
  const v = document.getElementById('ename').value.trim();
  if (!v) return;
  const mode = document.getElementById('emode').value;
  act(async () => {
    const { created } = await api('POST', 'events', { name:v, mode });
    pickEvent(created);
    // On arrive sur les paramètres du nouvel événement
    tab = 'evenements';
    [settingsFor, settingsDraft, newSetup] = [created, null, created];
  }).then(() => document.querySelector('.settings')?.scrollIntoView({ block:'start' }));
}
function openEvent(id) { pickEvent(id); tab = 'classement'; render(); }
function renameEvent(id) {
  const ev = state.events.find(e => e.id === id);
  const v = ev && prompt("Nouveau nom de l'événement :", ev.name);
  if (v && v.trim() && v.trim() !== ev.name) act(() => api('PATCH', 'events/' + id, { name:v.trim() }));
}
function delEvent(id) {
  const ev = state.events.find(e => e.id === id);
  const n = eventGames(ev).length;
  const what = n === 0 ? '' : n === 1 ? ' et sa partie' : ` et ses ${n} parties`;
  if (!ev || !confirm(`Supprimer « ${ev.name} »${what} ? Cette action est définitive.`)) return;
  act(() => api('DELETE', 'events/' + id));
}

document.querySelector('nav').addEventListener('click', e => {
  if (!e.target.dataset.tab) return;
  tab = e.target.dataset.tab;
  playerView = null;
  newSetup = null;   // naviguer par les onglets sort du parcours de création
  if (sheetView) { history.replaceState(null, '', location.pathname + location.search); sheetView = null; sheetFromApp = false; keepAwake(); }
  render();
});
window.addEventListener('hashchange', onRoute);
document.addEventListener('visibilitychange', keepAwake);
sheetView = sheetFromHash();
render();
refresh(true);
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
